name: Temporary sign Broad Leaf UI build11 candidate

on:
  push:
    branches: [codex/core-prune-standalone-ui-build11]
    paths:
      - .github/workflows/tmp-sign-broadleaf-ui11-candidate.yml

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check cryptography==50.0.1
      - name: Sign immutable Broad Leaf candidate repository
        env:
          SIGNING_KEY: ${{ secrets.MONITORBOX_MODULE_SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY"
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

          REPOSITORY_ID = "broadleaf-candidate"
          DISPLAY_NAME = "MonitorBox Broad Leaf Candidate"
          SIGNATURE_IDENTITY = "official-ed25519-1"

          def canonical(value):
              return json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
                  allow_nan=False,
              ).encode("utf-8")

          raw_key = base64.b64decode(os.environ["SIGNING_KEY"].strip(), validate=True)
          if len(raw_key) != 32:
              raise SystemExit("signing key must decode to 32 Ed25519 bytes")
          key = Ed25519PrivateKey.from_private_bytes(raw_key)

          source = json.loads(Path("catalog.source.json").read_text(encoding="utf-8"))
          modules = []
          seen = set()
          for item in source.get("modules", []):
              manifest = item["manifest"]
              package_name = item["package"]
              identity = (manifest["module_id"], manifest["version"], manifest["build"])
              if identity in seen:
                  raise SystemExit(f"duplicate module release: {identity}")
              seen.add(identity)
              package = Path("packages") / package_name
              if not package.is_file() or package.name != package_name or package.suffix != ".zip":
                  raise SystemExit(f"candidate package missing or invalid: {package_name}")
              payload = package.read_bytes()
              modules.append({
                  "manifest": manifest,
                  "package": {
                      "url": f"packages/{package_name}",
                      "filename": package_name,
                      "sha256": hashlib.sha256(payload).hexdigest(),
                      "signature_identity": SIGNATURE_IDENTITY,
                      "signature": base64.b64encode(key.sign(payload)).decode("ascii"),
                  },
              })

          modules.sort(key=lambda value: (
              value["manifest"]["module_id"],
              value["manifest"]["version"],
              value["manifest"]["build"],
          ))
          ui11 = [
              item for item in modules
              if item["manifest"]["module_id"] == "com.sickicarus.monitorbox.ui"
              and item["manifest"]["version"] == "1.1.3"
              and item["manifest"]["build"] == 11
          ]
          if len(ui11) != 1:
              raise SystemExit("candidate must contain exactly one UI 1.1.3 build 11 release")

          signed = {
              "repository_id": REPOSITORY_ID,
              "display_name": DISPLAY_NAME,
              "generated_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "modules": modules,
          }
          envelope = {
              "schema": 1,
              "signed": signed,
              "signature": {
                  "algorithm": "ed25519",
                  "identity": SIGNATURE_IDENTITY,
                  "value": base64.b64encode(key.sign(canonical(signed))).decode("ascii"),
              },
          }
          Path("broadleaf-candidate.json").write_text(
              json.dumps(envelope, indent=2) + "\n", encoding="utf-8"
          )
          print(
              "signed Broad Leaf candidate with "
              f"{len(modules)} releases; UI11 sha256={ui11[0]['package']['sha256']}"
          )
          PY
      - name: Commit candidate index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add broadleaf-candidate.json
          git commit -m "catalog: sign Broad Leaf UI build11 candidate"
          git push
