name: UI42 paired exact-beta-Core browser and snapshots

on:
  push:
    branches: [feature/91-ui42-dashboard-editor]
    paths:
      - "sources/ui/1.6.0-build42/**"
      - "tools/build_first_party_ui_build42.py"
      - "tools/stage_91_ui_build42.py"
      - "tools/accept_91_paired_core_ui42_browser.py"
      - ".github/workflows/ui42-paired-beta-core-acceptance.yml"
  pull_request:
    paths:
      - "sources/ui/1.6.0-build42/**"
      - "tools/build_first_party_ui_build42.py"
      - "tools/accept_91_paired_core_ui42_browser.py"
      - ".github/workflows/ui42-paired-beta-core-acceptance.yml"

permissions:
  contents: read

jobs:
  exact-core-managed-ui42:
    name: Real Core / managed UI42 / iPad Chromium / retained revisions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact UI42 candidate
        uses: actions/checkout@v6
        with:
          path: modules
          persist-credentials: false
      - name: Checkout code-identical qualified beta Core test source
        uses: actions/checkout@v6
        with:
          repository: SickIcarus-Labs/monitorbox
          ref: 447af4162951c83e77d5633593d2cf10f93c3c24
          path: core
          persist-credentials: false
      - name: Verify immutable beta Core source pin
        shell: bash
        run: |
          test "$(git -C core rev-parse HEAD)" = 447af4162951c83e77d5633593d2cf10f93c3c24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install exact Core, playwright and browser
        run: |
          python -m pip install --disable-pip-version-check -e ./core pytest pytest-asyncio playwright
          python -m playwright install --with-deps chromium
      - name: Run real Core + managed UI42 acceptance
        working-directory: modules
        env:
          MONITORBOX_PAIRED_MODULES_ROOT: ${{ github.workspace }}/modules
          MONITORBOX_PAIRED_CORE_ROOT: ${{ github.workspace }}/core
        run: python tools/accept_91_paired_core_ui42_browser.py
