name: P2 Phase 2 UI acceptance

on:
  pull_request:
    paths:
      - 'release-intents/ui-*.json'
      - 'sources/ui/**'
      - 'tools/build_first_party_ui_*.py'
      - 'tools/stage_p2_phase2_ui_build28.py'
      - 'tools/accept_ui_p2_phase2_build28*.py'
      - '.github/workflows/p2-phase2-ui-acceptance.yml'

permissions:
  contents: read

jobs:
  ui-phase2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Chromium acceptance dependency
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify build-28 package and release contract
        run: python tools/accept_ui_p2_phase2_build28.py
      - name: Verify Discoveries review hierarchy and Quick Add ordering
        run: python tools/accept_ui_p2_phase2_build28_browser.py
