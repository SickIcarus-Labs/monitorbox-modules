name: UI52 clean card-generation contract (#104)
on:
  push:
    branches: [feature/104-ui52-clean-card-engine]
    paths:
      - "sources/ui/1.16.0-build52/**"
      - "tools/accept_ui_build52_*"
      - "tools/build_first_party_ui_build52.py"
      - ".github/workflows/ui52-clean-card-engine.yml"
  pull_request:
    paths:
      - "sources/ui/1.16.0-build52/**"
      - "tools/accept_ui_build52_*"
      - "tools/build_first_party_ui_build52.py"
      - ".github/workflows/ui52-clean-card-engine.yml"
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check every new UI52 JavaScript asset
        run: |
          for asset in sources/ui/1.16.0-build52/*.js; do
            node --check "$asset"
          done
      - name: Clean bootstrap/Reset semantic parity (JS versus Python), member selection and LIVE sources
        run: node tools/accept_ui_build52_generator.mjs

  wip-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Exact source and deterministic TEST-ONLY UI52 package
        run: python tools/accept_ui_build52_package.py
  # The accepted Core repository is private: Modules' GITHUB_TOKEN cannot
  # checkout it. The exact paired gate runs in private Core draft PR #409,
  # using its own repository-scoped CI token. No production Core is modified.
  synthetic-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Disposable local Playwright
        run: |
          python -m pip install --disable-pip-version-check aiohttp==3.11.16 playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Actual native-card browser and member-selection parity
        run: python tools/accept_ui_build52_browser.py
