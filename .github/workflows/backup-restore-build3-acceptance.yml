name: Backup Restore build 3 acceptance

on:
  pull_request:
    paths:
      - sources/backup-restore/**
      - tools/build_first_party_backup_restore.py
      - tools/accept_backup_restore_build3_behavior.py
      - catalog.source.json
      - .github/workflows/backup-restore-build3-acceptance.yml
  push:
    branches:
      - 'publish/**'
    paths:
      - sources/backup-restore/**
      - tools/build_first_party_backup_restore.py
      - tools/accept_backup_restore_build3_behavior.py
      - catalog.source.json
      - .github/workflows/backup-restore-build3-acceptance.yml

permissions:
  contents: read

jobs:
  managed-restore-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install managed behavior dependencies
        run: python -m pip install --disable-pip-version-check aiohttp==3.11.16
      - name: Build immutable Backup Restore packages
        run: python tools/build_first_party_backup_restore.py
      - name: Verify build 3 restore workflow without bundled factory code
        run: python tools/accept_backup_restore_build3_behavior.py
