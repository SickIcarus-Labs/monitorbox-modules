name: Publish Broad Leaf runtime repairs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - sources/snmp/1.0.5-build7/**
      - sources/scrypted/2.1.2-build3/**
      - tools/build_first_party_snmp_105.py
      - tools/build_first_party_scrypted_212.py
      - tools/accept_snmp_v3_isolation.py
      - tools/accept_scrypted_managed_state.py
      - tools/stage_broadleaf_runtime_repairs.py
      - .github/workflows/publish-broadleaf-runtime-repairs.yml

permissions:
  contents: write

concurrency:
  group: publish-signed-catalog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Stage exact successor releases
        run: python tools/stage_broadleaf_runtime_repairs.py
      - name: Build immutable successor packages
        run: |
          python tools/build_first_party_snmp_105.py
          python tools/build_first_party_scrypted_212.py
      - name: Verify physical regressions before signing
        run: |
          python -m pip install --disable-pip-version-check aiohttp==3.11.16 cryptography==50.0.1
          python tools/accept_snmp_v3_isolation.py
          python tools/accept_scrypted_managed_state.py
      - name: Build signed repository index
        env:
          SIGNING_KEY: ${{ secrets.MONITORBOX_MODULE_SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY"
          python tools/build_repository.py --private-key "$SIGNING_KEY"
      - name: Commit published artifacts when changed
        run: |
          if git diff --quiet -- catalog.source.json packages index.json && test -z "$(git status --porcelain --untracked-files=all packages)"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.source.json packages index.json
          git commit -m "catalog: publish Broad Leaf runtime repairs"
          git push
