name: First-party module acceptance

on:
  pull_request:
    paths:
      - catalog.source.json
      - sources/ui/**
      - tools/build_first_party_ui.py
      - tools/accept_repository.py
      - tools/accept_frozen_core.py
      - tools/build_repository.py
      - .github/workflows/first-party-acceptance.yml
      - .github/workflows/publish.yml
  push:
    branches:
      - 'publish/**'
    paths:
      - catalog.source.json
      - sources/ui/**
      - tools/build_first_party_ui.py
      - tools/accept_repository.py
      - tools/accept_frozen_core.py
      - tools/build_repository.py
      - .github/workflows/first-party-acceptance.yml
      - .github/workflows/publish.yml

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install repository signing dependency
        run: python -m pip install --disable-pip-version-check cryptography==50.0.1
      - name: Build reproducible certified UI packages
        run: |
          python tools/build_first_party_ui.py
          sha256sum packages/com.sickicarus.monitorbox.ui-*.zip > /tmp/ui-packages.first
          python tools/build_first_party_ui.py
          sha256sum packages/com.sickicarus.monitorbox.ui-*.zip > /tmp/ui-packages.second
          diff -u /tmp/ui-packages.first /tmp/ui-packages.second
      - name: Verify package shape and signed repository contract
        run: python tools/accept_repository.py
