name: First-party module acceptance

on:
  pull_request:
    paths:
      - catalog.source.json
      - release-intents/**
      - sources/**
      - tools/build_first_party_*.py
      - tools/stage_*.py
      - tools/accept_*.py
      - tools/build_repository.py
      - .github/workflows/first-party-acceptance.yml
      - .github/workflows/publish.yml
  push:
    branches:
      - 'publish/**'
    paths:
      - catalog.source.json
      - release-intents/**
      - sources/**
      - tools/build_first_party_*.py
      - tools/stage_*.py
      - tools/accept_*.py
      - tools/build_repository.py
      - .github/workflows/first-party-acceptance.yml
      - .github/workflows/publish.yml

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install repository and browser acceptance dependencies
        run: |
          python -m pip install --disable-pip-version-check aiohttp==3.11.16 cryptography==50.0.1 playwright==1.55.0
          python -m playwright install --with-deps chromium
      - id: base
        name: Resolve exact candidate base authority
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          base="$PR_BASE_SHA"
          if [[ -z "$base" ]]; then
            git fetch --no-tags origin main:refs/remotes/origin/main
            base="$(git merge-base HEAD refs/remotes/origin/main)"
          fi
          git cat-file -e "$base^{commit}"
          git show "$base:catalog.source.json" > "$RUNNER_TEMP/catalog.before.json"
          echo "ref=$base" >> "$GITHUB_OUTPUT"
      - name: Stage and build changed release candidates — pass 1
        run: python tools/release_policy.py run-intents --base-ref '${{ steps.base.outputs.ref }}'
      - name: Snapshot changed candidate bytes — pass 1
        run: >-
          python tools/accept_candidate_repository.py
          --base-ref '${{ steps.base.outputs.ref }}'
          --snapshot /tmp/first-party-candidates.first.json
      - name: Stage and build changed release candidates — pass 2
        run: python tools/release_policy.py run-intents --base-ref '${{ steps.base.outputs.ref }}'
      - name: Prove candidate reproducibility and clean builder byproducts
        run: |
          set -euo pipefail
          python tools/accept_candidate_repository.py \
            --base-ref '${{ steps.base.outputs.ref }}' \
            --snapshot /tmp/first-party-candidates.second.json \
            --prune-unreferenced-untracked \
            --export-candidates /tmp/first-party-candidates
          diff -u /tmp/first-party-candidates.first.json /tmp/first-party-candidates.second.json
          cat /tmp/first-party-candidates.second.json
      - name: Verify staged candidate repository package/catalog integrity
        run: python tools/accept_candidate_repository.py
      - name: Verify managed HTTP behavior
        run: python tools/accept_http_behavior.py
      - name: Verify managed NUT behavior and provider-loss truth
        run: python tools/accept_nut_behavior.py
      - name: Verify managed SNMP credentials, versions, and provider-loss truth
        run: python tools/accept_snmp_behavior.py
      - name: Verify managed SNMP runtime provider-loss truth
        run: python tools/accept_snmp_runtime.py
      - name: Verify managed UniFi Network runtime and state continuity
        run: python tools/accept_unifi_runtime.py
      - name: Verify UniFi expectation-aware legacy topology policy
        run: python tools/accept_unifi_topology_policy.py
      - name: Verify managed UniFi Network auth-loss recovery
        run: python tools/accept_unifi_auth_recovery.py
      - name: Verify managed UniFi Network auth rate-limit backoff
        run: python tools/accept_unifi_auth_backoff.py
      - name: Verify managed Scrypted connection, camera runtime, and provider-loss recovery
        run: python tools/accept_scrypted_runtime.py
      - name: Verify managed Wake-on-LAN action execution without network traffic
        run: python tools/accept_wol_behavior.py
      - name: Verify Portainer complete inventory and provider-loss truth
        run: python tools/accept_portainer_runtime.py
      - name: Verify Portainer monitoring-coverage evidence
        run: python tools/accept_portainer_coverage.py
      - name: Verify Portainer lifecycle and bounded diagnostics truth
        run: python tools/accept_portainer_lifecycle.py
      - name: Verify standalone UI build-11 Core boundary
        run: python tools/accept_ui_build11_standalone.py
      - name: Verify UI semantic release identity scenarios
        run: node tools/accept_ui_semver_identity.cjs
      - name: Verify UI Compose hierarchy preserves canonical child truth
        run: node tools/accept_ui_compose_hierarchy.mjs
      - name: Verify UI build-9 hierarchy interactions
        run: node tools/accept_ui_build9_interactions.mjs
      - name: Verify UI build-10 physical hierarchy corrections
        run: node tools/accept_ui_build10_physical.mjs
      - name: Verify UI network traffic presentation
        run: node tools/accept_ui_network_traffic.mjs
      - name: Verify legacy provider-scale Discoveries presentation
        env:
          UI_DISCOVERY_SCREENSHOT: /tmp/ui-discovery-presentation.png
        run: python tools/accept_ui_discovery_presentation.py
      - name: Verify grouped coverage/action Discoveries presentation
        env:
          UI_DISCOVERY_COVERAGE_SCREENSHOT: /tmp/ui-discovery-coverage.png
        run: python tools/accept_ui_discovery_coverage.py
      - name: Verify P2 Phase 1 build-24 regression baseline
        run: python tools/accept_ui_p2_phase1_build24.py
      - name: Verify P2 Phase 1 build-24 browser regression baseline
        run: python tools/accept_ui_p2_phase1_build24_browser.py
      - name: Verify P2 Phase 1 build-25 physical-polish contract
        run: python tools/accept_ui_p2_phase1_build25.py
      - name: Verify P2 Phase 1 build-25 desktop and iPad corrections
        run: python tools/accept_ui_p2_phase1_build25_browser.py
      - name: Upload exact changed candidates for Broad Leaf acceptance
        uses: actions/upload-artifact@v4
        with:
          name: first-party-candidates-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/first-party-candidates
          if-no-files-found: error
          retention-days: 2
      - name: Upload Discoveries acceptance screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-discovery-acceptance
          path: |
            /tmp/ui-discovery-presentation.png
            /tmp/ui-discovery-coverage.png
          if-no-files-found: error
          retention-days: 2
      - name: Verify generic repository and channel invariants
        run: |
          python tools/accept_repository_version_order.py
          python tools/accept_module_channel_topology.py
      - name: Prove signed channel authority is read-only in first-party acceptance
        shell: bash
        run: |
          set -euo pipefail
          boundary="$(git merge-base '${{ steps.base.outputs.ref }}' HEAD)"
          git diff --exit-code "$boundary" HEAD -- index.json channels
          git diff --exit-code -- index.json channels
