name: First-party module acceptance

on:
  pull_request:
    paths:
      - catalog.source.json
      - sources/ui/**
      - sources/portainer/**
      - sources/http/**
      - sources/nut/**
      - sources/snmp/**
      - sources/unifi/**
      - sources/scrypted/**
      - sources/wol/**
      - tools/build_first_party_ui.py
      - tools/build_first_party_ui_current.py
      - tools/build_first_party_ui_build10.py
      - tools/build_first_party_portainer.py
      - tools/build_first_party_http.py
      - tools/build_first_party_nut.py
      - tools/build_first_party_snmp.py
      - tools/build_first_party_unifi.py
      - tools/build_first_party_scrypted.py
      - tools/build_first_party_wol.py
      - tools/accept_repository.py
      - tools/accept_repository_current.py
      - tools/accept_repository_build10.py
      - tools/accept_repository_http.py
      - tools/accept_repository_nut.py
      - tools/accept_repository_snmp.py
      - tools/accept_repository_unifi.py
      - tools/accept_repository_scrypted.py
      - tools/accept_repository_wol.py
      - tools/accept_http_behavior.py
      - tools/accept_nut_behavior.py
      - tools/accept_snmp_behavior.py
      - tools/accept_snmp_runtime.py
      - tools/accept_unifi_runtime.py
      - tools/accept_scrypted_runtime.py
      - tools/accept_wol_behavior.py
      - tools/accept_portainer_runtime.py
      - tools/accept_portainer_coverage.py
      - tools/accept_portainer_lifecycle.py
      - tools/accept_ui_compose_hierarchy.mjs
      - tools/accept_ui_build9_interactions.mjs
      - tools/accept_ui_build10_physical.mjs
      - tools/accept_ui_network_traffic.mjs
      - tools/accept_ui_discovery_presentation.py
      - tools/accept_ui_discovery_coverage.py
      - tools/accept_frozen_core.py
      - tools/accept_frozen_core_portainer.py
      - tools/build_repository.py
      - .github/workflows/first-party-acceptance.yml
      - .github/workflows/publish.yml
  push:
    branches:
      - 'publish/**'
    paths:
      - catalog.source.json
      - sources/ui/**
      - sources/portainer/**
      - sources/http/**
      - sources/nut/**
      - sources/snmp/**
      - sources/unifi/**
      - sources/scrypted/**
      - sources/wol/**
      - tools/build_first_party_ui.py
      - tools/build_first_party_ui_current.py
      - tools/build_first_party_ui_build10.py
      - tools/build_first_party_portainer.py
      - tools/build_first_party_http.py
      - tools/build_first_party_nut.py
      - tools/build_first_party_snmp.py
      - tools/build_first_party_unifi.py
      - tools/build_first_party_scrypted.py
      - tools/build_first_party_wol.py
      - tools/accept_repository.py
      - tools/accept_repository_current.py
      - tools/accept_repository_build10.py
      - tools/accept_repository_http.py
      - tools/accept_repository_nut.py
      - tools/accept_repository_snmp.py
      - tools/accept_repository_unifi.py
      - tools/accept_repository_scrypted.py
      - tools/accept_repository_wol.py
      - tools/accept_http_behavior.py
      - tools/accept_nut_behavior.py
      - tools/accept_snmp_behavior.py
      - tools/accept_snmp_runtime.py
      - tools/accept_unifi_runtime.py
      - tools/accept_scrypted_runtime.py
      - tools/accept_wol_behavior.py
      - tools/accept_portainer_runtime.py
      - tools/accept_portainer_coverage.py
      - tools/accept_portainer_lifecycle.py
      - tools/accept_ui_compose_hierarchy.mjs
      - tools/accept_ui_build9_interactions.mjs
      - tools/accept_ui_build10_physical.mjs
      - tools/accept_ui_network_traffic.mjs
      - tools/accept_ui_discovery_presentation.py
      - tools/accept_ui_discovery_coverage.py
      - tools/accept_frozen_core.py
      - tools/accept_frozen_core_portainer.py
      - tools/build_repository.py
      - .github/workflows/first-party-acceptance.yml
      - .github/workflows/publish.yml

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install repository and browser acceptance dependencies
        run: |
          python -m pip install --disable-pip-version-check aiohttp==3.11.16 cryptography==50.0.1 playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Build reproducible first-party packages
        run: |
          python tools/build_first_party_ui_build10.py
          python tools/build_first_party_portainer.py
          python tools/build_first_party_http.py
          python tools/build_first_party_nut.py
          python tools/build_first_party_snmp.py
          python tools/build_first_party_unifi.py
          python tools/build_first_party_scrypted.py
          python tools/build_first_party_wol.py
          sha256sum packages/com.sickicarus.monitorbox.ui-*.zip packages/com.sickicarus.monitorbox.portainer-*.zip packages/com.sickicarus.monitorbox.http-*.zip packages/com.sickicarus.monitorbox.nut-*.zip packages/com.sickicarus.monitorbox.snmp-*.zip packages/com.sickicarus.monitorbox.unifi-*.zip packages/com.sickicarus.monitorbox.scrypted-*.zip packages/com.sickicarus.monitorbox.wol-*.zip > /tmp/first-party-packages.first
          python tools/build_first_party_ui_build10.py
          python tools/build_first_party_portainer.py
          python tools/build_first_party_http.py
          python tools/build_first_party_nut.py
          python tools/build_first_party_snmp.py
          python tools/build_first_party_unifi.py
          python tools/build_first_party_scrypted.py
          python tools/build_first_party_wol.py
          sha256sum packages/com.sickicarus.monitorbox.ui-*.zip packages/com.sickicarus.monitorbox.portainer-*.zip packages/com.sickicarus.monitorbox.http-*.zip packages/com.sickicarus.monitorbox.nut-*.zip packages/com.sickicarus.monitorbox.snmp-*.zip packages/com.sickicarus.monitorbox.unifi-*.zip packages/com.sickicarus.monitorbox.scrypted-*.zip packages/com.sickicarus.monitorbox.wol-*.zip > /tmp/first-party-packages.second
          diff -u /tmp/first-party-packages.first /tmp/first-party-packages.second
      - name: Verify managed HTTP behavior
        run: python tools/accept_http_behavior.py
      - name: Verify managed NUT behavior and provider-loss truth
        run: python tools/accept_nut_behavior.py
      - name: Verify managed SNMP credentials, versions, and provider-loss truth
        run: python tools/accept_snmp_behavior.py
      - name: Verify managed SNMP runtime provider-loss truth
        run: python tools/accept_snmp_runtime.py
      - name: Verify managed UniFi Network runtime and state continuity
        run: python tools/accept_unifi_runtime.py
      - name: Verify managed Scrypted connection, camera runtime, and provider-loss recovery
        run: python tools/accept_scrypted_runtime.py
      - name: Verify managed Wake-on-LAN action execution without network traffic
        run: python tools/accept_wol_behavior.py
      - name: Verify Portainer complete inventory and provider-loss truth
        run: python tools/accept_portainer_runtime.py
      - name: Verify Portainer monitoring-coverage evidence
        run: python tools/accept_portainer_coverage.py
      - name: Verify Portainer lifecycle and bounded diagnostics truth
        run: python tools/accept_portainer_lifecycle.py
      - name: Verify UI Compose hierarchy preserves canonical child truth
        run: node tools/accept_ui_compose_hierarchy.mjs
      - name: Verify UI build-9 hierarchy interactions
        run: node tools/accept_ui_build9_interactions.mjs
      - name: Verify UI build-10 physical hierarchy corrections
        run: node tools/accept_ui_build10_physical.mjs
      - name: Verify UI network traffic presentation
        run: node tools/accept_ui_network_traffic.mjs
      - name: Verify legacy provider-scale Discoveries presentation
        env:
          UI_DISCOVERY_SCREENSHOT: /tmp/ui-discovery-presentation.png
        run: python tools/accept_ui_discovery_presentation.py
      - name: Verify grouped coverage/action Discoveries presentation
        env:
          UI_DISCOVERY_COVERAGE_SCREENSHOT: /tmp/ui-discovery-coverage.png
        run: python tools/accept_ui_discovery_coverage.py
      - name: Upload Discoveries acceptance screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-discovery-acceptance
          path: |
            /tmp/ui-discovery-presentation.png
            /tmp/ui-discovery-coverage.png
          if-no-files-found: error
      - name: Verify package shape, activation regression, and signed repository contract
        run: python tools/accept_repository_wol.py
