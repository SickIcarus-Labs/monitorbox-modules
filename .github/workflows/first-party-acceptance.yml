name: First-party module acceptance

on:
  pull_request:
    paths:
      - catalog.source.json
      - sources/ui/**
      - sources/portainer/**
      - tools/build_first_party_ui.py
      - tools/build_first_party_portainer.py
      - tools/accept_repository.py
      - tools/accept_portainer_runtime.py
      - tools/accept_frozen_core.py
      - tools/accept_frozen_core_portainer.py
      - tools/build_repository.py
      - .github/workflows/first-party-acceptance.yml
      - .github/workflows/publish.yml
  push:
    branches:
      - 'publish/**'
    paths:
      - catalog.source.json
      - sources/ui/**
      - sources/portainer/**
      - tools/build_first_party_ui.py
      - tools/build_first_party_portainer.py
      - tools/accept_repository.py
      - tools/accept_portainer_runtime.py
      - tools/accept_frozen_core.py
      - tools/accept_frozen_core_portainer.py
      - tools/build_repository.py
      - .github/workflows/first-party-acceptance.yml
      - .github/workflows/publish.yml

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout accepted MonitorBox Core 0547
        uses: actions/checkout@v6
        with:
          repository: SickIcarus-Labs/monitorbox
          ref: ba89f9623bfa1b406720444bf7ca51f5dc3b04bb
          path: frozen-core
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install acceptance dependencies
        run: |
          python -m pip install --disable-pip-version-check cryptography==50.0.1
          python -m pip install --disable-pip-version-check -e ./frozen-core
      - name: Build reproducible first-party packages
        run: |
          python tools/build_first_party_ui.py
          python tools/build_first_party_portainer.py
          sha256sum packages/com.sickicarus.monitorbox.ui-*.zip packages/com.sickicarus.monitorbox.portainer-*.zip > /tmp/first-party-packages.first
          python tools/build_first_party_ui.py
          python tools/build_first_party_portainer.py
          sha256sum packages/com.sickicarus.monitorbox.ui-*.zip packages/com.sickicarus.monitorbox.portainer-*.zip > /tmp/first-party-packages.second
          diff -u /tmp/first-party-packages.first /tmp/first-party-packages.second
      - name: Verify Portainer complete inventory and provider-loss truth
        run: python tools/accept_portainer_runtime.py
      - name: Verify package shape and signed repository contract
        run: python tools/accept_repository.py
      - name: Resolve Portainer build 4 through accepted Core 0547
        run: python tools/accept_frozen_core_portainer.py
