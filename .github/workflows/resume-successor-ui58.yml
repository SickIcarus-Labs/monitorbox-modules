name: Resume previously signed UI58 immutable candidate

# Never signs or rebuilds a ZIP/OCI image. Only validates already-published
# immutable UI58 sequence-10 artifacts and promotes pointers after durable receipt.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type resume-verified-ui58
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: successor-signed-feed-publication
  cancel-in-progress: false

jobs:
  resume:
    name: GET-only immutable readback, signed candidate pairing, durable receipt, promote
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == 'SickIcarus' &&
      ((github.event_name == 'issue_comment' &&
        github.event.issue.number == 185 &&
        github.event.issue.pull_request &&
        github.event.comment.body == '/resume-successor-ui58-stable') ||
       (github.event_name == 'workflow_dispatch' &&
        inputs.confirmation == 'resume-verified-ui58'))
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      packages: write
    env:
      EXPECTED_FULL: sha256:0cb9957271e371e3bcc3f6b82cdc5f697d282f03fd7b5504b8eeb030a3701e72
      EXPECTED_SUP: sha256:222b35c294302623f4dea9697124d6a43aef7f085682115f21399457257eb9ef
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_READ_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require merged reviewed recovery PR
        if: github.event_name == 'issue_comment'
        env:
          ${{ github.token }}: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/185" | jq -e '
            .state == "closed" and .merged_at != null and
            .base.ref == "main" and
            .head.repo.full_name == "SickIcarus-Labs/monitorbox-modules"
          '
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install existing signed OCI verifier
        run: python -m pip install --disable-pip-version-check 'cryptography>=45,<49' 'jsonschema>=4,<5'
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v4
      - name: Verify both current immutable stable authorities, without publishing
        shell: bash
        run: bash tools/publish_successor_ui58.sh preflight
      - name: Verify already published immutable UI58 pair, source labels and 22 exact ZIPs
        shell: bash
        run: |
          set -euo pipefail
          tag="ui58-seq10-9d4f4eac2bad0a64672a60456737cc5dc306b548"
          full="ghcr.io/sickicarus-labs/monitorbox-successor-signed-feed"
          sup="ghcr.io/sickicarus-labs/monitorbox-successor-supervisor-feed"
          full_digest="$(docker buildx imagetools inspect "$full:$tag" | awk '/^Digest:/ {print $2;exit}')"
          sup_digest="$(docker buildx imagetools inspect "$sup:$tag" | awk '/^Digest:/ {print $2;exit}')"
          [[ "$full_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$sup_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          root="$RUNNER_TEMP/successor-ui58"
          PYTHONPATH=tools python tools/verify_successor_ui58_immutable.py \
            --prior "$root/prior/platform/packages" \
            --prior-index "$root/prior/platform/channels/stable/index.json" \
            --output "$root/resumed" \
            --full-digest "$full_digest" \
            --supervisor-digest "$sup_digest" \
            --expected-full "$EXPECTED_FULL" \
            --expected-supervisor "$EXPECTED_SUP"
          cp "$root/resumed/promotion-receipt.json" "$root/promotion-receipt.json"
          test -s "$root/promotion-receipt.json"
      - name: Persist exact old/target recovery receipt before any pointer writes
        uses: actions/upload-artifact@v4
        with:
          name: ui58-immutable-resume-receipt
          path: ${{ runner.temp }}/successor-ui58/promotion-receipt.json
          retention-days: 90
          if-no-files-found: error
      - name: Guarded Stable pair and Beta/Dev pointer promotion
        shell: bash
        run: bash tools/publish_successor_ui58.sh promote
