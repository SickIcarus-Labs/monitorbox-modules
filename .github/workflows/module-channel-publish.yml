name: Module channel publication

# Trusted publication bridge for module confidence channels.
#
# - successful exact-head module acceptance automatically publishes the PR candidate
#   to the signed dev repository;
# - /publish-dev is the manual recovery spelling for the same exact-head operation;
# - /promote-beta republishes the exact accepted candidate under beta authority;
# - /yank-dev restores dev to the frozen stable module baseline;
# - /promote-stable promotes the exact signed beta snapshot to stable `official`.
#
# Candidate code never executes in the signing job. The signing key is exposed only to
# trusted-main tooling after staged catalog/package bytes have been independently checked.
on:
  workflow_run:
    workflows: ["First-party module acceptance"]
    types: [completed]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: module-repository-write
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve module channel authority
    if: >-
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success'
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.comment.user.login == 'SickIcarus' &&
        (
          github.event.comment.body == '/publish-dev' ||
          github.event.comment.body == '/promote-beta' ||
          github.event.comment.body == '/yank-dev' ||
          github.event.comment.body == '/promote-stable'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      publish: ${{ steps.resolve.outputs.publish }}
      mode: ${{ steps.resolve.outputs.mode }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          COMMAND: ${{ github.event.comment.body || '' }}
          IS_PR_COMMENT: ${{ github.event.issue.pull_request && 'true' || 'false' }}
        run: |
          set -euo pipefail

          skip_auto() {
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Module dev publication skipped: $1"
            exit 0
          }

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            mode="dev"
            pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
            expected_sha="$(jq -r '.workflow_run.head_sha // empty' "$GITHUB_EVENT_PATH")"
            [[ -n "$pr_number" && -n "$expected_sha" ]] || skip_auto "workflow result has no exact PR head"
          else
            case "$COMMAND" in
              /publish-dev) mode="dev" ;;
              /promote-beta) mode="beta" ;;
              /yank-dev) mode="yank-dev" ;;
              /promote-stable) mode="stable" ;;
              *) echo "::error::Unsupported module publication command"; exit 1 ;;
            esac
            pr_number="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
            expected_sha=""
          fi

          if [[ "$mode" == "stable" ]]; then
            {
              echo "publish=true"
              echo "mode=stable"
              echo "pr_number=$pr_number"
              echo "candidate_sha="
              echo "base_sha="
            } >> "$GITHUB_OUTPUT"
            echo "Module publication mode: stable"
            echo "Source authority: exact signed beta snapshot"
            exit 0
          fi

          if [[ "$IS_PR_COMMENT" != "true" && "$EVENT_NAME" != "workflow_run" ]]; then
            echo "::error::$COMMAND must be issued on a module release PR"
            exit 1
          fi

          metadata="$RUNNER_TEMP/module-candidate-pr.json"
          paths="$RUNNER_TEMP/module-candidate-paths.txt"
          gh api "repos/$REPO/pulls/$pr_number" > "$metadata"
          gh api --paginate "repos/$REPO/pulls/$pr_number/files?per_page=100" --jq '.[].filename' > "$paths"

          [[ "$(jq -r '.base.ref' "$metadata")" == "main" ]] || {
            [[ "$EVENT_NAME" == "workflow_run" ]] && skip_auto "PR no longer targets main"
            echo "::error::Module publication requires a main-target PR"; exit 1
          }
          [[ "$(jq -r '.head.repo.full_name' "$metadata")" == "$REPO" ]] || {
            [[ "$EVENT_NAME" == "workflow_run" ]] && skip_auto "PR is not same-repository"
            echo "::error::Module publication requires a same-repository PR"; exit 1
          }

          state="$(jq -r '.state' "$metadata")"
          merged="$(jq -r '.merged_at // empty' "$metadata")"
          if [[ "$mode" == "dev" && "$state" != "open" ]]; then
            [[ "$EVENT_NAME" == "workflow_run" ]] && skip_auto "PR is no longer open"
            echo "::error::Dev publication requires an open PR"; exit 1
          fi
          if [[ "$mode" == "beta" && "$state" != "open" && -z "$merged" ]]; then
            echo "::error::Beta promotion requires an open or merged PR"; exit 1
          fi

          candidate_sha="$(jq -r '.head.sha' "$metadata")"
          base_sha="$(jq -r '.base.sha' "$metadata")"
          if [[ -n "$expected_sha" && "$candidate_sha" != "$expected_sha" ]]; then
            skip_auto "acceptance SHA $expected_sha is stale; PR head is $candidate_sha"
          fi

          if [[ "$mode" != "yank-dev" ]]; then
            grep -Eq '^release-intents/[^/]+\.json$' "$paths" || {
              [[ "$EVENT_NAME" == "workflow_run" ]] && skip_auto "PR declares no module release intent"
              echo "::error::Module publication requires a changed release intent"; exit 1
            }

            runs="$RUNNER_TEMP/module-candidate-runs.json"
            gh api "repos/$REPO/actions/runs?head_sha=$candidate_sha&event=pull_request&per_page=100" > "$runs"
            for required in "Module release policy" "First-party module acceptance"; do
              jq -e --arg required "$required" '
                .workflow_runs
                | any(.name == $required and .status == "completed" and .conclusion == "success")
              ' "$runs" >/dev/null || {
                echo "::error::Exact-head gate is not green: $required"
                exit 1
              }
            done
          fi

          {
            echo "publish=true"
            echo "mode=$mode"
            echo "pr_number=$pr_number"
            echo "candidate_sha=$candidate_sha"
            echo "base_sha=$base_sha"
          } >> "$GITHUB_OUTPUT"
          echo "Module publication mode: $mode"
          echo "Candidate PR: #$pr_number"
          echo "Candidate SHA: $candidate_sha"

  build_candidate:
    name: Stage exact candidate without signing authority
    needs: [resolve]
    if: >-
      needs.resolve.outputs.publish == 'true' &&
      (needs.resolve.outputs.mode == 'dev' || needs.resolve.outputs.mode == 'beta')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out trusted release policy
        uses: actions/checkout@v6
        with:
          ref: main
          path: trusted
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 0
          path: candidate
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Stage and validate candidate with trusted policy
        shell: bash
        env:
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
        run: |
          set -euo pipefail
          cd candidate
          git fetch --no-tags origin "$BASE_SHA"
          git show "$BASE_SHA:catalog.source.json" > "$RUNNER_TEMP/catalog.before.json"
          python ../trusted/tools/release_policy.py run-intents --base-ref "$BASE_SHA"
          python ../trusted/tools/release_policy.py validate \
            --base-catalog "$RUNNER_TEMP/catalog.before.json" \
            --candidate-catalog catalog.source.json \
            --base-ref "$BASE_SHA" \
            --require-packages
      - name: Retain unsigned candidate distribution set
        uses: actions/upload-artifact@v4
        with:
          name: module-channel-candidate-${{ needs.resolve.outputs.candidate_sha }}
          path: |
            candidate/catalog.source.json
            candidate/packages
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Sign and publish module channel
    needs: [resolve, build_candidate]
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      needs.resolve.outputs.publish == 'true' &&
      (
        needs.resolve.outputs.mode == 'stable' ||
        needs.resolve.outputs.mode == 'yank-dev' ||
        needs.build_candidate.result == 'success'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out trusted current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          path: trusted
      - name: Check out exact candidate source without executing it
        if: needs.resolve.outputs.mode == 'dev' || needs.resolve.outputs.mode == 'beta'
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.candidate_sha }}
          fetch-depth: 0
          path: candidate-source
      - name: Download staged candidate distribution
        if: needs.resolve.outputs.mode == 'dev' || needs.resolve.outputs.mode == 'beta'
        uses: actions/download-artifact@v5
        with:
          name: module-channel-candidate-${{ needs.resolve.outputs.candidate_sha }}
          path: staged
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install trusted signing dependency
        run: python -m pip install --disable-pip-version-check cryptography==50.0.1
      - name: Revalidate staged candidate without executing candidate code
        if: needs.resolve.outputs.mode == 'dev' || needs.resolve.outputs.mode == 'beta'
        shell: bash
        env:
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
        run: |
          set -euo pipefail
          rm -rf candidate-source/packages
          cp staged/catalog.source.json candidate-source/catalog.source.json
          cp -a staged/packages candidate-source/packages
          cd candidate-source
          git fetch --no-tags origin "$BASE_SHA"
          git show "$BASE_SHA:catalog.source.json" > "$RUNNER_TEMP/catalog.before.signing.json"
          python ../trusted/tools/release_policy.py validate \
            --base-catalog "$RUNNER_TEMP/catalog.before.signing.json" \
            --candidate-catalog catalog.source.json \
            --base-ref "$BASE_SHA" \
            --require-packages

      - name: Freeze stable baseline snapshot if not yet recorded
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f trusted/channels/stable/index.json ]]; then
            test -f trusted/channels/stable/catalog.source.json
            test -d trusted/channels/stable/packages
            exit 0
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path('trusted/catalog.source.json').read_text())
          index = json.loads(Path('trusted/index.json').read_text())
          if index.get('signed', {}).get('repository_id') != 'official':
              raise SystemExit('root stable index is not official authority')
          source_ids = {
              (x['manifest']['module_id'], x['manifest']['version'], x['manifest']['build'])
              for x in source.get('modules', [])
          }
          index_ids = {
              (x['manifest']['module_id'], x['manifest']['version'], x['manifest']['build'])
              for x in index.get('signed', {}).get('modules', [])
          }
          if source_ids != index_ids:
              raise SystemExit('cannot bootstrap stable snapshot: trunk source has diverged from signed stable authority')
          PY

          mkdir -p trusted/channels/stable/packages
          cp trusted/catalog.source.json trusted/channels/stable/catalog.source.json
          cp trusted/index.json trusted/channels/stable/index.json
          cp trusted/packages/*.zip trusted/channels/stable/packages/

      - name: Verify stable promotion source is the exact beta snapshot
        if: needs.resolve.outputs.mode == 'stable'
        shell: bash
        run: |
          set -euo pipefail
          test -f trusted/channels/beta/catalog.source.json
          test -f trusted/channels/beta/index.json
          test -d trusted/channels/beta/packages
          python - <<'PY'
          import json
          from pathlib import Path

          beta_source = json.loads(Path('trusted/channels/beta/catalog.source.json').read_text())
          beta_index = json.loads(Path('trusted/channels/beta/index.json').read_text())
          trunk = json.loads(Path('trusted/catalog.source.json').read_text())
          if beta_index.get('signed', {}).get('repository_id') != 'official-beta':
              raise SystemExit('beta snapshot is not signed as official-beta')

          def keyed(document):
              return {
                  (x['manifest']['module_id'], x['manifest']['version'], x['manifest']['build']): x['manifest']
                  for x in document.get('modules', [])
              }

          beta_source_map = keyed(beta_source)
          beta_index_map = {
              (x['manifest']['module_id'], x['manifest']['version'], x['manifest']['build']): x['manifest']
              for x in beta_index.get('signed', {}).get('modules', [])
          }
          trunk_map = keyed(trunk)
          if beta_source_map != beta_index_map:
              raise SystemExit('beta catalog source and signed beta index disagree')
          missing = [key for key, manifest in beta_source_map.items() if trunk_map.get(key) != manifest]
          if missing:
              raise SystemExit('beta contains release identities not materialized in main: ' + repr(missing))
          PY

      - name: Sign exact requested channel with trusted-main tooling
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.MONITORBOX_MODULE_SIGNING_KEY }}
          MODE: ${{ needs.resolve.outputs.mode }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY"
          case "$MODE" in
            dev)
              source_root="candidate-source"
              repository_id="official-dev"
              ;;
            beta)
              source_root="candidate-source"
              repository_id="official-beta"
              ;;
            yank-dev)
              source_root="trusted/channels/stable"
              repository_id="official-dev"
              ;;
            stable)
              source_root="trusted/channels/beta"
              repository_id="official"
              ;;
            *) echo "::error::Unsupported mode $MODE"; exit 1 ;;
          esac

          python trusted/tools/build_repository.py \
            --source "$source_root/catalog.source.json" \
            --output "$RUNNER_TEMP/channel-index.json" \
            --repository-id "$repository_id" \
            --private-key "$SIGNING_KEY"

          if [[ "$MODE" == "dev" && ! -f trusted/channels/beta/index.json ]]; then
            python trusted/tools/build_repository.py \
              --source trusted/channels/stable/catalog.source.json \
              --output "$RUNNER_TEMP/beta-bootstrap-index.json" \
              --repository-id official-beta \
              --private-key "$SIGNING_KEY"
          fi

      - name: Commit exact channel authority
        shell: bash
        env:
          MODE: ${{ needs.resolve.outputs.mode }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
        run: |
          set -euo pipefail

          if [[ "$MODE" == "stable" ]]; then
            source_root="trusted/channels/beta"
            rm -rf trusted/channels/stable
            mkdir -p trusted/channels/stable/packages trusted/packages
            cp "$source_root/catalog.source.json" trusted/channels/stable/catalog.source.json
            cp "$RUNNER_TEMP/channel-index.json" trusted/channels/stable/index.json
            cp "$source_root"/packages/*.zip trusted/channels/stable/packages/
            cp "$RUNNER_TEMP/channel-index.json" trusted/index.json
            cp "$source_root"/packages/*.zip trusted/packages/
            add_paths=(index.json packages channels/stable)
            message="channels: promote cumulative beta to stable"
          else
            if [[ "$MODE" == "yank-dev" ]]; then
              channel="dev"
              source_root="trusted/channels/stable"
              message="channels: yank dev to stable baseline"
            else
              channel="$MODE"
              source_root="candidate-source"
              message="channels: publish $channel candidate ${CANDIDATE_SHA:0:12}"
            fi

            target="trusted/channels/$channel"
            rm -rf "$target"
            mkdir -p "$target/packages"
            cp "$source_root/catalog.source.json" "$target/catalog.source.json"
            cp "$RUNNER_TEMP/channel-index.json" "$target/index.json"
            cp "$source_root"/packages/*.zip "$target/packages/"

            if [[ "$MODE" == "dev" && ! -f trusted/channels/beta/index.json ]]; then
              mkdir -p trusted/channels/beta/packages
              cp trusted/channels/stable/catalog.source.json trusted/channels/beta/catalog.source.json
              cp "$RUNNER_TEMP/beta-bootstrap-index.json" trusted/channels/beta/index.json
              cp trusted/channels/stable/packages/*.zip trusted/channels/beta/packages/
            fi
            add_paths=(channels)
          fi

          if git -C trusted diff --quiet -- "${add_paths[@]}" && test -z "$(git -C trusted status --porcelain --untracked-files=all -- "${add_paths[@]}")"; then
            echo "Requested module channel already matches exact authority"
            exit 0
          fi
          git -C trusted config user.name "github-actions[bot]"
          git -C trusted config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C trusted add "${add_paths[@]}"
          git -C trusted commit -m "$message"
          git -C trusted push origin HEAD:main
