name: Temporary build Broad Leaf UI11 candidate repository

on:
  push:
    branches: [tmp/broadleaf-ui11-candidate]
    paths:
      - .github/workflows/tmp-build-broadleaf-ui11-candidate.yml

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check cryptography==50.0.1
      - name: Generate isolated candidate trust and signed repository
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

          REPOSITORY_ID = "broadleaf-candidate"
          DISPLAY_NAME = "MonitorBox Broad Leaf Candidate"
          SIGNATURE_IDENTITY = "broadleaf-test-ed25519-1"

          def canonical(value):
              return json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
                  allow_nan=False,
              ).encode("utf-8")

          key = Ed25519PrivateKey.generate()
          public = key.public_key().public_bytes(
              encoding=serialization.Encoding.Raw,
              format=serialization.PublicFormat.Raw,
          )
          public_b64 = base64.b64encode(public).decode("ascii")

          source = json.loads(Path("catalog.source.json").read_text(encoding="utf-8"))
          modules = []
          seen = set()
          for item in source.get("modules", []):
              manifest = item["manifest"]
              package_name = item["package"]
              identity = (manifest["module_id"], manifest["version"], manifest["build"])
              if identity in seen:
                  raise SystemExit(f"duplicate module release: {identity}")
              seen.add(identity)
              package = Path("packages") / package_name
              if not package.is_file() or package.name != package_name or package.suffix != ".zip":
                  raise SystemExit(f"candidate package missing or invalid: {package_name}")
              payload = package.read_bytes()
              modules.append({
                  "manifest": manifest,
                  "package": {
                      "url": f"packages/{package_name}",
                      "filename": package_name,
                      "sha256": hashlib.sha256(payload).hexdigest(),
                      "signature_identity": SIGNATURE_IDENTITY,
                      "signature": base64.b64encode(key.sign(payload)).decode("ascii"),
                  },
              })

          modules.sort(key=lambda value: (
              value["manifest"]["module_id"],
              value["manifest"]["version"],
              value["manifest"]["build"],
          ))
          ui11 = [
              item for item in modules
              if item["manifest"]["module_id"] == "com.sickicarus.monitorbox.ui"
              and item["manifest"]["version"] == "1.1.3"
              and item["manifest"]["build"] == 11
          ]
          if len(ui11) != 1:
              raise SystemExit("candidate must contain exactly one UI 1.1.3 build 11 release")

          signed = {
              "repository_id": REPOSITORY_ID,
              "display_name": DISPLAY_NAME,
              "generated_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "modules": modules,
          }
          envelope = {
              "schema": 1,
              "signed": signed,
              "signature": {
                  "algorithm": "ed25519",
                  "identity": SIGNATURE_IDENTITY,
                  "value": base64.b64encode(key.sign(canonical(signed))).decode("ascii"),
              },
          }
          Path("broadleaf-candidate.json").write_text(
              json.dumps(envelope, indent=2) + "\n", encoding="utf-8"
          )
          Path("broadleaf-candidate-public-key.txt").write_text(public_b64 + "\n", encoding="ascii")
          Path("broadleaf-candidate-metadata.json").write_text(
              json.dumps({
                  "repository_id": REPOSITORY_ID,
                  "display_name": DISPLAY_NAME,
                  "signature_identity": SIGNATURE_IDENTITY,
                  "public_key_base64": public_b64,
                  "ui_build11_sha256": ui11[0]["package"]["sha256"],
                  "source_head": "a06d99ebaf2352d19716391db5592722650e4880",
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"candidate public key: {public_b64}")
          print(f"UI11 sha256: {ui11[0]['package']['sha256']}")
          PY
      - name: Commit immutable candidate material
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add broadleaf-candidate.json broadleaf-candidate-public-key.txt broadleaf-candidate-metadata.json
          git commit -m "test: materialize signed Broad Leaf UI11 candidate"
          git push
