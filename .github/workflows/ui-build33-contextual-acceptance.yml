name: UI build33 contextual acceptance

on:
  pull_request:
    paths:
      - sources/ui/1.2.1-build33/**
      - tools/build_first_party_ui_build33.py
      - tools/stage_p0_315_ui_build33.py
      - tools/accept_ui_build33_contextual.py
      - release-intents/ui-1.2.1-build33.json
      - .github/workflows/ui-build33-contextual-acceptance.yml

permissions:
  contents: read

jobs:
  contextual-configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install browser acceptance dependency
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Compile build33 tooling
        run: python -m py_compile tools/build_first_party_ui_build33.py tools/stage_p0_315_ui_build33.py tools/accept_ui_build33_contextual.py
      - name: Verify contextual configuration desktop and iPad contract
        run: python tools/accept_ui_build33_contextual.py
