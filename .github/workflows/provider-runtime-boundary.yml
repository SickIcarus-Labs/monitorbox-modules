name: Pruned Core provider runtime

on:
  pull_request:
    paths:
      - sources/nut/**
      - sources/snmp/**
      - sources/scrypted/**
      - tools/build_first_party_nut*.py
      - tools/build_first_party_snmp*.py
      - tools/build_first_party_scrypted*.py
      - tools/accept_nut_behavior.py
      - tools/accept_snmp_pruned_core.py
      - tools/accept_snmp_v3_isolation.py
      - tools/accept_scrypted_pruned_core.py
      - tools/accept_scrypted_managed_state.py
      - .github/workflows/provider-runtime-boundary.yml
  push:
    branches: [main]
    paths:
      - sources/nut/**
      - sources/snmp/**
      - sources/scrypted/**
      - tools/build_first_party_nut*.py
      - tools/build_first_party_snmp*.py
      - tools/build_first_party_scrypted*.py
      - tools/accept_nut_behavior.py
      - tools/accept_snmp_pruned_core.py
      - tools/accept_snmp_v3_isolation.py
      - tools/accept_scrypted_pruned_core.py
      - tools/accept_scrypted_managed_state.py
      - .github/workflows/provider-runtime-boundary.yml

permissions:
  contents: read

jobs:
  provider-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install generic runtime dependencies
        run: python -m pip install --disable-pip-version-check aiohttp==3.11.16 cryptography==50.0.1
      - name: Prepare immutable provider regression artifacts
        run: |
          set -euo pipefail
          # NUT build 2 and Scrypted build 3 are accepted immutable packages.
          # Their regressions consume the checked-in artifacts directly; historical
          # builders must not be rerun after newer immutable generations exist.
          test -f packages/com.sickicarus.monitorbox.nut-1.0.1-build2.zip
          test -f packages/com.sickicarus.monitorbox.scrypted-2.1.1-build3.zip
          # Historical SNMP 1.0.5 is still reconstructed in an isolated directory
          # because its isolation acceptance explicitly exercises that builder.
          snmp_out=/tmp/provider-runtime-snmp-105
          rm -rf "$snmp_out"
          mkdir -p "$snmp_out"
          cp packages/com.sickicarus.monitorbox.snmp-1.0.4-build6.zip "$snmp_out/"
          python tools/build_first_party_snmp_105.py --output-dir "$snmp_out"
      - name: Verify NUT owns execution after Core prune
        run: python tools/accept_nut_behavior.py
      - name: Verify historical SNMP pruned-Core boundary remains intact
        run: python tools/accept_snmp_pruned_core.py
      - name: Verify current SNMP owns isolated self-contained transport
        run: python tools/accept_snmp_v3_isolation.py
      - name: Verify historical Scrypted persisted-generation compatibility
        run: python tools/accept_scrypted_pruned_core.py
      - name: Verify current Scrypted uses Core-owned writable IPC state
        run: python tools/accept_scrypted_managed_state.py
