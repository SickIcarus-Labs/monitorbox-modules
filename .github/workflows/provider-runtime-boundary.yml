name: Pruned Core provider runtime

on:
  pull_request:
    paths:
      - sources/nut/**
      - sources/snmp/**
      - sources/scrypted/**
      - tools/build_first_party_nut.py
      - tools/build_first_party_snmp.py
      - tools/build_first_party_scrypted.py
      - tools/accept_nut_behavior.py
      - tools/accept_snmp_pruned_core.py
      - tools/accept_scrypted_pruned_core.py
      - .github/workflows/provider-runtime-boundary.yml
  push:
    branches: [main]
    paths:
      - sources/nut/**
      - sources/snmp/**
      - sources/scrypted/**
      - tools/build_first_party_nut.py
      - tools/build_first_party_snmp.py
      - tools/build_first_party_scrypted.py
      - tools/accept_nut_behavior.py
      - tools/accept_snmp_pruned_core.py
      - tools/accept_scrypted_pruned_core.py
      - .github/workflows/provider-runtime-boundary.yml

permissions:
  contents: read

jobs:
  provider-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install generic runtime dependencies
        run: python -m pip install --disable-pip-version-check aiohttp==3.11.16 cryptography==50.0.1
      - name: Build repaired managed providers
        run: |
          python tools/build_first_party_nut.py
          python tools/build_first_party_snmp.py
          python tools/build_first_party_scrypted.py
      - name: Verify NUT owns execution after Core prune
        run: python tools/accept_nut_behavior.py
      - name: Verify SNMP owns a self-contained transport after Core prune
        run: python tools/accept_snmp_pruned_core.py
      - name: Verify Scrypted owns persisted-generation worker compatibility
        run: python tools/accept_scrypted_pruned_core.py
