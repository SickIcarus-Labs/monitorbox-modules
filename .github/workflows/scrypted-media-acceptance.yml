name: Scrypted managed media acceptance

on:
  pull_request:
    paths:
      - catalog.source.json
      - sources/scrypted/**
      - tools/build_first_party_scrypted.py
      - tools/accept_scrypted_runtime.py
      - tools/accept_scrypted_media.py
      - tools/accept_repository_scrypted.py
      - tools/accept_repository_provider_repairs.py
      - tools/accept_scrypted_media_repository.py
      - .github/workflows/scrypted-media-acceptance.yml
  push:
    branches:
      - main
    paths:
      - catalog.source.json
      - sources/scrypted/**
      - tools/build_first_party_scrypted.py
      - tools/accept_scrypted_media.py
      - tools/accept_repository_scrypted.py
      - tools/accept_repository_provider_repairs.py
      - tools/accept_scrypted_media_repository.py
      - .github/workflows/scrypted-media-acceptance.yml

permissions:
  contents: read

jobs:
  media-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install acceptance dependencies
        run: python -m pip install --disable-pip-version-check aiohttp==3.11.16 cryptography==50.0.1
      - name: Build Scrypted package reproducibly
        run: |
          set -euo pipefail
          first=/tmp/scrypted-211-first
          second=/tmp/scrypted-211-second
          rm -rf "$first" "$second"
          python tools/build_first_party_scrypted.py --output-dir "$first"
          python tools/build_first_party_scrypted.py --output-dir "$second"
          sha256sum "$first/com.sickicarus.monitorbox.scrypted-2.1.1-build2.zip" | awk '{print $1}' > /tmp/scrypted.first
          sha256sum "$second/com.sickicarus.monitorbox.scrypted-2.1.1-build2.zip" | awk '{print $1}' > /tmp/scrypted.second
          diff -u /tmp/scrypted.first /tmp/scrypted.second
      - name: Verify Scrypted 2.0 worker regression
        run: python tools/accept_scrypted_runtime.py
      - name: Verify Scrypted 2.1 managed snapshot/live media
        run: python tools/accept_scrypted_media.py
      - name: Verify current Scrypted catalog and package shape
        run: python tools/accept_scrypted_media_repository.py
