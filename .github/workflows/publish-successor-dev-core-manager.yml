name: Protected signed successor Dev module publication

# Owner-only main branch: manual dispatch or authenticated issue #195 comment.
# Private Core CI publishes a digest-pinned unsigned build; only this trusted
# modules workflow signs the packages. No cross-repository PAT or Core checkout.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type publish-v3-dev-core-manager, publish-v3-dev-agent or publish-v3-dev-backup-restore
        required: true
        type: string
      core_source_sha:
        description: Exact reviewed 40-character source commit (Core or modules main)
        required: true
        type: string
      expected_dev_full:
        description: Current immutable full-feed :dev sha256 digest
        required: true
        type: string
      unsigned_candidate_digest:
        description: Exact immutable unsigned OCI digest (native), or B/R ZIP sha256
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  resolve:
    name: Authenticate owner Dev release command
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == 'SickIcarus' &&
      (
        (github.event_name == 'workflow_dispatch' &&
         (inputs.confirmation == 'publish-v3-dev-core-manager' ||
          inputs.confirmation == 'publish-v3-dev-agent' ||
          inputs.confirmation == 'publish-v3-dev-backup-restore')) ||
        (github.event_name == 'issue_comment' &&
         github.event.comment.user.login == 'SickIcarus' &&
         (github.event.issue.number == 195 || github.event.issue.number == 792) &&
         !github.event.issue.pull_request &&
         (startsWith(github.event.comment.body, '/publish-v3-dev-core-manager ') ||
          startsWith(github.event.comment.body, '/publish-v3-dev-agent ') ||
          startsWith(github.event.comment.body, '/publish-v3-dev-backup-restore ')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      core_source_sha: ${{ steps.intent.outputs.core_source_sha }}
      expected_dev_full: ${{ steps.intent.outputs.expected_dev_full }}
      unsigned_digest: ${{ steps.intent.outputs.unsigned_digest }}
      release_kind: ${{ steps.intent.outputs.release_kind }}
    steps:
      - name: Validate exact owner release intent
        id: intent
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SHA: ${{ inputs.core_source_sha }}
          MANUAL_DIGEST: ${{ inputs.expected_dev_full }}
          MANUAL_UNSIGNED: ${{ inputs.unsigned_candidate_digest }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "issue_comment" ]]; then
            command="$(jq -r '.comment.body // empty' "$GITHUB_EVENT_PATH")"
            read -r action source_sha digest unsigned_digest extra <<< "$command"
            test "$action" = "/publish-v3-dev-core-manager" || test "$action" = "/publish-v3-dev-agent" || test "$action" = "/publish-v3-dev-backup-restore"
            test -z "${extra:-}"
          else
            source_sha="$MANUAL_SHA"
            digest="$MANUAL_DIGEST"
            unsigned_digest="$MANUAL_UNSIGNED"
            action="/$CONFIRMATION"
          fi
          case "$action" in
            /publish-v3-dev-core-manager) kind=core-manager ;;
            /publish-v3-dev-agent) kind=agent ;;
            /publish-v3-dev-backup-restore) kind=backup-restore ;;
            *) exit 1 ;;
          esac
          if [[ "$action" == /publish-v3-dev-backup-restore && "$EVENT_NAME" == issue_comment ]]; then
            test "$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")" = 792
          fi
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$unsigned_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "release_kind=$kind" >> "$GITHUB_OUTPUT"
          echo "unsigned_digest=$unsigned_digest" >> "$GITHUB_OUTPUT"
          echo "core_source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "expected_dev_full=$digest" >> "$GITHUB_OUTPUT"
  unsigned:
    name: Verify digest-pinned unsigned native ZIPs
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      packages: read
    env:
      CORE_SOURCE_SHA: ${{ needs.resolve.outputs.core_source_sha }}
      EXPECTED_DEV_FULL: ${{ needs.resolve.outputs.expected_dev_full }}
      UNSIGNED_DIGEST: ${{ needs.resolve.outputs.unsigned_digest }}
      RELEASE_KIND: ${{ needs.resolve.outputs.release_kind }}
      # Reuse the already-authorized unsigned package, with immutable digest-pinned tags.
      STAGING: ghcr.io/sickicarus-labs/monitorbox-dev-unsigned-core-manager
      FULL: ghcr.io/sickicarus-labs/monitorbox-successor-signed-feed
    steps:
      - uses: actions/checkout@v7
        if: needs.resolve.outputs.release_kind == 'backup-restore'
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        if: needs.resolve.outputs.release_kind == 'backup-restore'
        with:
          python-version: '3.13'
      - name: Install app package dependencies
        if: needs.resolve.outputs.release_kind == 'backup-restore'
        run: python -m pip install --disable-pip-version-check 'cryptography>=45,<49' 'jsonschema>=4,<5'
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v4
      - name: Verify exact public Dev baseline and immutable unsigned OCI digest
        if: needs.resolve.outputs.release_kind != 'backup-restore'
        run: |
          [[ "$CORE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$UNSIGNED_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$EXPECTED_DEV_FULL" =~ ^sha256:[a-f0-9]{64}$ ]]
          observed="$(docker buildx imagetools inspect "$FULL:dev" | awk '/^Digest:/ {print $2;exit}')"
          test "$observed" = "$EXPECTED_DEV_FULL"
          docker pull --quiet --platform linux/amd64 "$STAGING@$UNSIGNED_DIGEST" >/dev/null
          cid="$(docker create --platform linux/amd64 "$STAGING@$UNSIGNED_DIGEST" /bin/true)"
          mkdir -p "$RUNNER_TEMP/new-packages"
          docker cp "$cid:/unsigned/." "$RUNNER_TEMP/new-packages/"
          docker rm -f "$cid" >/dev/null
      - name: Admit exact native ZIP set and Core source provenance
        if: needs.resolve.outputs.release_kind != 'backup-restore'
        run: |
          python - <<'PY'
          import hashlib,json,os,re,zipfile
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"new-packages"
          receipt=json.loads((root/"manifest.json").read_text())
          assert receipt["core_source_sha"]==os.environ["CORE_SOURCE_SHA"]
          packages=receipt["packages"]
          ids=("com.sickicarus.monitorbox.agent",) if os.environ["RELEASE_KIND"]=="agent" else (
              "com.sickicarus.monitorbox.core", "com.sickicarus.monitorbox.scaffold-manager",
          )
          expected={(mid,arch) for mid in ids for arch in ("amd64","arm64")}
          assert len(packages)==len(expected)
          assert {(p["artifact_id"],p["arch"]) for p in packages}==expected
          assert {p.name for p in root.iterdir()}=={"manifest.json"}|{p["name"] for p in packages}
          for item in packages:
              name=item["name"]
              assert Path(name).name==name and re.fullmatch(r"[a-f0-9]{64}",item["sha256"])
              file=root/name
              assert hashlib.sha256(file.read_bytes()).hexdigest()==item["sha256"]
              with zipfile.ZipFile(file) as z:
                  assert z.testzip() is None
                  assert z.namelist().count("package.json")==1
                  meta=json.loads(z.read("package.json"))
                  assert meta["artifact_id"]==item["artifact_id"]
                  assert meta["git_sha"]==os.environ["CORE_SOURCE_SHA"]
          PY
      - name: Build exact B/R from reviewed public modules main (no signing key)
        if: needs.resolve.outputs.release_kind == 'backup-restore'
        env:
          PYTHONPATH: tools
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CORE_SOURCE_SHA"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from build_successor_first_party_modules import (
              BACKUP_RESTORE_ID, _parse_authority, build_package,
          )
          record = _parse_authority()[BACKUP_RESTORE_ID]
          assert (record["version"], record["build"]) == ("1.0.6", 8)
          root = Path(os.environ["RUNNER_TEMP"]) / "new-packages"
          root.mkdir()
          path = build_package(record, root, release_eligible=True)
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          assert "sha256:" + digest == os.environ["UNSIGNED_DIGEST"], "reviewed package digest drift"
          receipt = {"core_source_sha": os.environ["CORE_SOURCE_SHA"], "packages": [{
              "artifact_id": BACKUP_RESTORE_ID, "arch": "any",
              "name": path.name, "sha256": digest,
          }]}
          (root / "manifest.json").write_text(json.dumps(receipt, sort_keys=True) + "\n")
          print(f"Exact B/R build8 source={os.environ['CORE_SOURCE_SHA']} sha256:{digest}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-dev-native
          path: ${{ runner.temp }}/new-packages/
          if-no-files-found: error
          retention-days: 7

  publish:
    # Lock only eligible publishing jobs: unrelated issue comments must not
    # cancel pending releases before their owner/command guards can skip.
    concurrency:
      group: successor-signed-feed-publication
      cancel-in-progress: false
    name: Protected official signer; immutable readback; Dev-only pointer transaction
    needs: [resolve, unsigned]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      CORE_SOURCE_SHA: ${{ needs.resolve.outputs.core_source_sha }}
      EXPECTED_DEV_FULL: ${{ needs.resolve.outputs.expected_dev_full }}
      RELEASE_KIND: ${{ needs.resolve.outputs.release_kind }}
      FULL: ghcr.io/sickicarus-labs/monitorbox-successor-signed-feed
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install trusted signer/verifier dependencies
        run: python -m pip install --disable-pip-version-check 'cryptography>=45,<49' 'jsonschema>=4,<5'
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-dev-native
          path: ${{ runner.temp }}/new-packages/
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify exact signed full Dev baseline and reuse its packages
        run: |
          set -euo pipefail
          resolve() { docker buildx imagetools inspect "$1" | awk '/^Digest:/ {print $2;exit}'; }
          test "$(resolve "$FULL:dev")" = "$EXPECTED_DEV_FULL"
          for channel in stable beta; do
            test -n "$(resolve "$FULL:$channel")"
          done
          docker pull --quiet --platform linux/amd64 "$FULL@$EXPECTED_DEV_FULL" >/dev/null
          cid="$(docker create --platform linux/amd64 "$FULL@$EXPECTED_DEV_FULL")"
          mkdir -p "$RUNNER_TEMP/prior/platform"
          docker cp "$cid:/feed/platform/." "$RUNNER_TEMP/prior/platform/"
          docker rm -f "$cid" >/dev/null
          for channel in stable beta dev; do
            test -s "$RUNNER_TEMP/prior/platform/channels/$channel/index.json"
          done
      - name: Admit exact native ZIPs and stage unsigned complete Dev closure
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          from successor_dev_release import AGENT,CORE,MANAGER
          from successor_dev_stage import stage_unsigned_dev_delta
          root=Path(os.environ["RUNNER_TEMP"])
          manifest=json.loads((root/"new-packages/manifest.json").read_text())
          assert manifest["core_source_sha"]==os.environ["CORE_SOURCE_SHA"]
          expected={"com.sickicarus.monitorbox.agent"} if os.environ["RELEASE_KIND"]=="agent" else {
              "com.sickicarus.monitorbox.core", "com.sickicarus.monitorbox.scaffold-manager"
          }
          assert len(manifest["packages"])==len(expected)*2
          replacements={}
          for item in manifest["packages"]:
            mid,arch=item["artifact_id"],item["arch"]
            filename=item["name"]
            assert mid in expected and arch in ("amd64","arm64")
            assert Path(filename).name==filename and re.fullmatch(r"[0-9a-f]{64}",item["sha256"])
            source=root/"new-packages"/filename
            assert hashlib.sha256(source.read_bytes()).hexdigest()==item["sha256"]
            assert (mid,arch) not in replacements
            replacements[mid,arch]=source
          stage_unsigned_dev_delta(
            previous_packages=root/"prior/platform/packages",
            previous_dev_index=root/"prior/platform/channels/dev/index.json",
            replacements=replacements,
            output=root/"unsigned",
            core_source_sha=os.environ["CORE_SOURCE_SHA"],
            trust_root=Path("trust/official-ed25519-1.pub"),
            changed_ids=frozenset(expected),
          )
          PY
        env:
          PYTHONPATH: tools
      - name: Sign only the admitted complete Dev candidate
        env:
          MONITORBOX_PLATFORM_SIGNING_KEY: ${{ secrets.MONITORBOX_MODULE_SIGNING_KEY }}
          PYTHONPATH: tools
        run: |
          set -euo pipefail
          test -n "$MONITORBOX_PLATFORM_SIGNING_KEY"
          python tools/sign_successor_dev_stage.py \
            --prior-platform "$RUNNER_TEMP/prior/platform" \
            --unsigned-candidate "$RUNNER_TEMP/unsigned" \
            --output "$RUNNER_TEMP/signed" \
            --trust-root trust/official-ed25519-1.pub \
            --core-source-sha "$CORE_SOURCE_SHA"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"signed"
          intent=json.loads((root/"release-intent.json").read_text())
          assert intent["outer_channels_to_publish"]==["dev"]
          assert intent["artifact_count"]==22
          assert intent["changed_module_ids"]==(\
              ["com.sickicarus.monitorbox.agent"] if os.environ["RELEASE_KIND"]=="agent" else [
              "com.sickicarus.monitorbox.core", "com.sickicarus.monitorbox.scaffold-manager",
          ])
          PY
      - name: Publish immutable full Dev image; leave Stable and Beta untouched
        run: |
          set -euo pipefail
          tag="dev-$RELEASE_KIND-$CORE_SOURCE_SHA-$GITHUB_RUN_ID"
          echo "IMMUTABLE_TAG=$tag" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/signed/full/tools"
          cp platform/acceptance-feed.Dockerfile "$RUNNER_TEMP/signed/full/Dockerfile"
          cp tools/successor_feed_server.go "$RUNNER_TEMP/signed/full/tools/"
          if docker buildx imagetools inspect "$FULL:$tag" >/dev/null 2>&1; then
            echo "::error::immutable release tag already exists"; exit 1
          fi
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=false --push \
            --tag "$FULL:$tag" "$RUNNER_TEMP/signed/full"
      - name: Verify immutable full Dev image byte-for-byte on AMD64 and ARM64
        run: |
          set -euo pipefail
          resolve() { docker buildx imagetools inspect "$1" | awk '/^Digest:/ {print $2;exit}'; }
          full="$(resolve "$FULL:$IMMUTABLE_TAG")"
          [[ "$full" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "NEW_DEV_FULL=$full" >> "$GITHUB_ENV"
          # Classic Docker image stores cannot safely reuse a single OCI index
          # digest as two different locally selected platform images.
          # Bind each readback to the architecture-specific immutable manifest.
          docker buildx imagetools inspect "$FULL@$full" --raw > "$RUNNER_TEMP/full-oci-index.json"
          for arch in amd64 arm64; do
            platform_digest="$(jq -er --arg arch "$arch" '
              [.manifests[] | select(.platform.os == "linux" and
                                    .platform.architecture == $arch) | .digest]
              | if length == 1 then .[0] else error("missing/duplicate platform") end
            ' "$RUNNER_TEMP/full-oci-index.json")"
            [[ "$platform_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            docker pull --quiet --platform "linux/$arch" "$FULL@$platform_digest" >/dev/null
            cid="$(docker create --platform "linux/$arch" "$FULL@$platform_digest")"
            mkdir -p "$RUNNER_TEMP/readback"
            docker cp "$cid:/feed/platform/." "$RUNNER_TEMP/readback/"
            docker rm -f "$cid" >/dev/null
            diff -rq "$RUNNER_TEMP/signed/full/platform" "$RUNNER_TEMP/readback"
            rm -rf "$RUNNER_TEMP/readback"
          done
      - name: Save immutable release receipt before moving Dev pointers
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"signed"
          intent=json.loads((root/"release-intent.json").read_text())
          intent.update({
            "source_sha":os.environ["CORE_SOURCE_SHA"],
            "prior_dev_full_digest":os.environ["EXPECTED_DEV_FULL"],
            "new_dev_full_digest":os.environ["NEW_DEV_FULL"],
            "state":"immutable-published-not-promoted",
          })
          (root/"promotion-receipt.json").write_text(json.dumps(intent,indent=2,sort_keys=True)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: successor-dev-protected-promotion-receipt
          path: ${{ runner.temp }}/signed/promotion-receipt.json
          retention-days: 90
          if-no-files-found: error
      - name: Guarded full Dev promotion with verified readback and rollback
        run: |
          set -euo pipefail
          resolve() { docker buildx imagetools inspect "$1" | awk '/^Digest:/ {print $2;exit}'; }
          test "$(resolve "$FULL:dev")" = "$EXPECTED_DEV_FULL"
          stable_full="$(resolve "$FULL:stable")"
          beta_full="$(resolve "$FULL:beta")"
          rollback_dev() {
            echo "::error::Dev catalog promotion failed; restore exact previous digest"
            current="$(resolve "$FULL:dev" 2>/dev/null || true)"
            if [[ "$current" == "$NEW_DEV_FULL" ]]; then
              docker buildx imagetools create --tag "$FULL:dev" "$FULL@$EXPECTED_DEV_FULL" || true
            fi
            test "$(resolve "$FULL:dev")" = "$EXPECTED_DEV_FULL" || echo "::error::manual Dev catalog recovery required"
          }
          trap rollback_dev ERR
          docker buildx imagetools create --tag "$FULL:dev" "$FULL@$NEW_DEV_FULL"
          test "$(resolve "$FULL:dev")" = "$NEW_DEV_FULL"
          test "$(resolve "$FULL:stable")" = "$stable_full"
          test "$(resolve "$FULL:beta")" = "$beta_full"
          trap - ERR
          echo "Verified signed v3 full Dev catalog available via Check for Updates -> Update All." >> "$GITHUB_STEP_SUMMARY"
