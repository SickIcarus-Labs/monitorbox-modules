name: Publish signed catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - catalog.source.json
      - packages/**
      - release-intents/**
      - sources/ui/**
      - sources/portainer/**
      - sources/http/**
      - sources/nut/**
      - sources/snmp/**
      - sources/unifi/**
      - sources/scrypted/**
      - sources/wol/**
      - sources/configuration-bootstrap/**
      - sources/backup-restore/**
      - tools/build_first_party_*.py
      - tools/stage_*.py
      - tools/release_policy.py
      - tools/build_repository.py
      - .github/workflows/publish.yml

permissions:
  contents: write

concurrency:
  group: publish-signed-catalog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - id: base
        name: Capture pre-publication authority
        shell: bash
        run: |
          set -euo pipefail
          base="HEAD^"
          git show "$base:catalog.source.json" > "$RUNNER_TEMP/catalog.before.json"
          echo "ref=$base" >> "$GITHUB_OUTPUT"
      - name: Stage catalog migrations
        run: |
          python tools/stage_snmp_zipimport_hotfix.py
          python tools/stage_snmp_mib_zipimport_hotfix.py
      - name: Reproduce current immutable first-party packages
        run: |
          python tools/build_first_party_ui_build11.py
          python tools/build_first_party_portainer.py
          python tools/build_first_party_http.py
          python tools/build_first_party_nut.py
          python tools/build_first_party_snmp_mib_hotfix.py
          python tools/build_first_party_unifi.py
          python tools/build_first_party_scrypted.py
          python tools/build_first_party_wol.py
          python tools/build_first_party_configuration_bootstrap.py
          python tools/build_first_party_backup_restore.py
      - name: Stage and build declared successor releases
        run: python tools/release_policy.py run-intents --base-ref '${{ steps.base.outputs.ref }}'
      - name: Enforce semantic module release authority before signing
        run: >-
          python tools/release_policy.py validate
          --base-catalog "$RUNNER_TEMP/catalog.before.json"
          --candidate-catalog catalog.source.json
          --base-ref '${{ steps.base.outputs.ref }}'
          --require-packages
      - run: python -m pip install --disable-pip-version-check cryptography
      - name: Build signed repository index
        env:
          SIGNING_KEY: ${{ secrets.MONITORBOX_MODULE_SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY"
          python tools/build_repository.py --private-key "$SIGNING_KEY"
      - name: Commit published artifacts when changed
        run: |
          if git diff --quiet -- catalog.source.json packages index.json && test -z "$(git status --porcelain --untracked-files=all packages)"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.source.json packages index.json
          git commit -m "catalog: publish signed repository index"
          git push
