name: Materialize module release source

# Trunk/source authority only.
#
# A release-source merge to main may stage the canonical catalog source and immutable
# package bytes needed by later phases, but it MUST NOT sign or advance the stable
# `official` repository. Stable confidence is changed only by explicit channel promotion.
# Phase-1+ releases are fully declared by release intents; historical packages are
# already immutable repository state and are never blanket-rebuilt here.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - catalog.source.json
      - packages/**
      - release-intents/**
      - sources/ui/**
      - sources/portainer/**
      - sources/http/**
      - sources/nut/**
      - sources/snmp/**
      - sources/unifi/**
      - sources/scrypted/**
      - sources/wol/**
      - sources/configuration-bootstrap/**
      - sources/backup-restore/**
      - tools/build_first_party_*.py
      - tools/stage_*.py
      - tools/release_policy.py
      - .github/workflows/publish.yml

permissions:
  contents: write

concurrency:
  group: module-repository-write
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - id: base
        name: Capture pre-merge source authority
        shell: bash
        run: |
          set -euo pipefail
          base="HEAD^"
          git show "$base:catalog.source.json" > "$RUNNER_TEMP/catalog.before.json"
          echo "ref=$base" >> "$GITHUB_OUTPUT"
      - name: Stage and build only declared successor releases
        run: python tools/release_policy.py run-intents --base-ref '${{ steps.base.outputs.ref }}'
      - name: Enforce semantic module release authority
        run: >-
          python tools/release_policy.py validate
          --base-catalog "$RUNNER_TEMP/catalog.before.json"
          --candidate-catalog catalog.source.json
          --base-ref '${{ steps.base.outputs.ref }}'
          --require-packages
      - name: Prove stable signed authority is untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- index.json
      - name: Commit source/package authority when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- catalog.source.json packages && test -z "$(git status --porcelain --untracked-files=all packages)"; then
            echo "No source/package materialization required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.source.json packages
          git commit -m "catalog: materialize module release source"
          git push
