name: Publish signed catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - catalog.source.json
      - packages/**
      - tools/build_repository.py

permissions:
  contents: write

concurrency:
  group: publish-signed-catalog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check cryptography
      - name: Build signed repository index
        env:
          SIGNING_KEY: ${{ secrets.MONITORBOX_MODULE_SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY"
          python tools/build_repository.py --private-key "$SIGNING_KEY"
      - name: Commit catalog when changed
        run: |
          if git diff --quiet -- index.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "catalog: publish signed repository index"
          git push

