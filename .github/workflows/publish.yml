name: Materialize module release source

# Trunk/source authority only.
#
# A release-source merge to main may stage the canonical catalog source and immutable
# package bytes needed by later phases, but it MUST NOT sign or advance the stable
# `official` repository. Stable confidence is changed only by explicit channel promotion.
# Phase-1+ releases are fully declared by release intents; historical packages are
# already immutable repository state and are never blanket-rebuilt here.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - catalog.source.json
      - packages/**
      - release-intents/**
      - sources/ui/**
      - sources/portainer/**
      - sources/http/**
      - sources/nut/**
      - sources/snmp/**
      - sources/unifi/**
      - sources/scrypted/**
      - sources/wol/**
      - sources/configuration-bootstrap/**
      - sources/backup-restore/**
      - tools/build_first_party_*.py
      - tools/stage_*.py
      - tools/release_policy.py
      - .github/workflows/publish.yml

permissions:
  contents: write

concurrency:
  group: module-repository-write
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Release validation proves historical signed-dev authority ancestry.
          # A shallow clone cannot establish that trust relationship and must not
          # be used for source materialization.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - id: base
        name: Capture pre-merge source authority
        shell: bash
        run: |
          set -euo pipefail
          base="HEAD^"
          git show "$base:catalog.source.json" > "$RUNNER_TEMP/catalog.before.json"
          echo "ref=$base" >> "$GITHUB_OUTPUT"
      - name: Stage and build only declared successor releases
        run: python tools/release_policy.py run-intents --base-ref '${{ steps.base.outputs.ref }}'
      - name: Remove unreferenced builder byproducts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          source = json.loads(Path("catalog.source.json").read_text(encoding="utf-8"))
          referenced = set()
          for row in source.get("modules", []):
              package = row.get("package")
              if isinstance(package, str) and package:
                  referenced.add(Path(package).name)
              elif isinstance(package, dict):
                  filename = package.get("filename")
                  if isinstance(filename, str) and filename:
                      referenced.add(Path(filename).name)

          for path in sorted(Path("packages").glob("*.zip")):
              if path.name in referenced:
                  continue
              tracked = subprocess.run(
                  ["git", "ls-files", "--error-unmatch", "--", str(path)],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              ).returncode == 0
              if not tracked:
                  print(f"removing unreferenced builder byproduct: {path}")
                  path.unlink()
          PY
      - name: Enforce semantic module release authority
        run: >-
          python tools/release_policy.py validate
          --base-catalog "$RUNNER_TEMP/catalog.before.json"
          --candidate-catalog catalog.source.json
          --base-ref '${{ steps.base.outputs.ref }}'
          --trusted-ref '${{ steps.base.outputs.ref }}'
          --require-packages
      - name: Prove stable signed authority is untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- index.json
      - name: Commit source/package authority when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- catalog.source.json packages && test -z "$(git status --porcelain --untracked-files=all packages)"; then
            echo "No source/package materialization required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.source.json packages
          git commit -m "catalog: materialize module release source"

          # Other trusted repository writers (for example signed channel publication)
          # share the module-repository-write concurrency group and may have advanced
          # main while this push-triggered run waited. Preserve the trigger/base
          # authority used above, then replay only this generated materialization
          # commit on the current serialized main tip. Never force-push.
          git fetch --no-tags origin main
          git rebase origin/main
          git push origin HEAD:main
