name: Publish signed catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - catalog.source.json
      - packages/**
      - sources/ui/**
      - sources/portainer/**
      - tools/build_first_party_ui.py
      - tools/build_first_party_ui_current.py
      - tools/build_first_party_ui_build10.py
      - tools/build_first_party_portainer.py
      - tools/build_repository.py
      - .github/workflows/publish.yml

permissions:
  contents: write

concurrency:
  group: publish-signed-catalog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build immutable first-party packages
        run: |
          python tools/build_first_party_ui_build10.py
          python tools/build_first_party_portainer.py
      - run: python -m pip install --disable-pip-version-check cryptography
      - name: Build signed repository index
        env:
          SIGNING_KEY: ${{ secrets.MONITORBOX_MODULE_SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY"
          python tools/build_repository.py --private-key "$SIGNING_KEY"
      - name: Commit published artifacts when changed
        run: |
          if git diff --quiet -- packages index.json && test -z "$(git status --porcelain --untracked-files=all packages)"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages index.json
          git commit -m "catalog: publish signed repository index"
          git push
