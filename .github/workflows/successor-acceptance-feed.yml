name: Successor immutable acceptance feed

on:
  pull_request:
    paths:
      - "platform/**"
      - "tools/build_platform_index.py"
      - "tools/verify_platform_index.py"
      - "tools/portable_contracts.py"
      - "tools/build_successor_first_party_modules.py"
      - "tools/qualify_successor_runtime_artifacts.py"
      - "tools/build_successor_acceptance_feed_source.py"
      - "tools/successor_feed_server.go"
      - ".github/workflows/successor-acceptance-feed.yml"
      - "tools/test_successor_acceptance_publish_contract.py"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type publish-immutable-successor-feed"
        required: true
        type: string
      sequence:
        description: "Monotonic immutable acceptance catalog sequence"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: successor-acceptance-feed-${{ github.event_name == 'workflow_dispatch' && 'publish' || github.ref }}
  cancel-in-progress: false

env:
  MODULES_SOURCE_SHA: 87b164d4b317955210d0b2af5c9e8623cccae197
  CORE_SOURCE_SHA: 0fdb5572185af7cf7a18fa384d9bedd391cdb4d8
  REAL_PYTHON_SOURCE_SHA: 3e4cf4ae9072efff941f35a2b0b20b7b493de4cc
  FEED_IMAGE: ghcr.io/sickicarus-labs/monitorbox-successor-feed

jobs:
  build-native:
    name: Build exact native acceptance packages / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Check out exact qualified Modules source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.MODULES_SOURCE_SHA }}
          path: source
          persist-credentials: false
      - name: Check out exact MonitorBox source
        uses: actions/checkout@v7
        with:
          repository: SickIcarus-Labs/monitorbox
          ref: ${{ env.CORE_SOURCE_SHA }}
          path: core
          persist-credentials: false
      - name: Check out immutable reviewed Python/wheel source
        uses: actions/checkout@v7
        with:
          repository: SickIcarus-Labs/monitorbox
          ref: ${{ env.REAL_PYTHON_SOURCE_SHA }}
          path: real-python
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false
      - name: Require exact source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$MODULES_SOURCE_SHA"
          test "$(git -C core rev-parse HEAD)" = "$CORE_SOURCE_SHA"
          test "$(git -C real-python rev-parse HEAD)" = "$REAL_PYTHON_SOURCE_SHA"
      - name: Build exact fourteen-wheel reviewed proof
        shell: bash
        run: |
          set -euo pipefail
          python real-python/tools/build_successor_wheelhouse.py             --source-root real-python             --wheel-dir "$RUNNER_TEMP/native-wheels"             --output "$RUNNER_TEMP/wheelhouse-proof.zip"             --download
      - name: Re-derive exact archived Debian ICMP/ABI closure
        shell: bash
        run: |
          set -euo pipefail
          id=$(docker create python:3.13-slim-bookworm@sha256:2325bb286ec344af3e5898cc224b5844e2707ac6e26b1632516fd3edc84a5e26)
          trap 'docker rm -f "$id" >/dev/null 2>&1 || true' EXIT
          docker cp "$id:/usr/share/keyrings/debian-archive-keyring.gpg" "$RUNNER_TEMP/debian-archive-keyring.gpg"
          echo "506b815cbb32d9b6066b4a2aa524071e071761e7e7f68c3ac74f3061ba852017  $RUNNER_TEMP/debian-archive-keyring.gpg" | sha256sum --check --status
          python source/tools/discover_archived_debian.py             --arch ${{ matrix.arch }}             --keyring "$RUNNER_TEMP/debian-archive-keyring.gpg"             --approved-lock "source/platform/runtime/debian/snapshot-${{ matrix.arch }}.json"             --output "$RUNNER_TEMP/reviewed-debian"
          mkdir -p source/platform/runtime/debian/debs
          cp "$RUNNER_TEMP"/reviewed-debian/*.deb source/platform/runtime/debian/debs/
      - name: Build reviewed Python and Node runtime proofs
        shell: bash
        run: |
          set -euo pipefail
          docker build             -f source/platform/runtime/Dockerfile             --target packer             --tag "mb-acceptance-runtime:${{ matrix.arch }}"             source
          mkdir -p "$RUNNER_TEMP/python-runtime" "$RUNNER_TEMP/node-runtime"
          id=$(docker create "mb-acceptance-runtime:${{ matrix.arch }}")
          trap 'docker rm -f "$id" >/dev/null 2>&1 || true' EXIT
          docker cp "$id:/proof/python/." "$RUNNER_TEMP/python-runtime/"
          docker cp "$id:/proof/node/." "$RUNNER_TEMP/node-runtime/"
      - name: Qualify native runtime and wheelhouse package bytes
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/packages"
          mkdir -p "$out"
          python source/tools/qualify_successor_runtime_artifacts.py runtime             --runtime-root "$RUNNER_TEMP/python-runtime"             --snapshot-lock "source/platform/runtime/debian/snapshot-${{ matrix.arch }}.json"             --output "$out/runtime-python-${{ matrix.arch }}.zip"
          python source/tools/qualify_successor_runtime_artifacts.py runtime             --runtime-root "$RUNNER_TEMP/node-runtime"             --snapshot-lock "source/platform/runtime/debian/snapshot-${{ matrix.arch }}.json"             --output "$out/runtime-node-${{ matrix.arch }}.zip"
          python source/tools/qualify_successor_runtime_artifacts.py wheelhouse             --source "$RUNNER_TEMP/wheelhouse-proof.zip"             --output "$out/core-wheels-${{ matrix.arch }}.zip"
      - name: Derive exact interpreted dependency references
        shell: bash
        env:
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          arch=os.environ["MATRIX_ARCH"]
          root=Path(os.environ["RUNNER_TEMP"])/"packages"
          def package_manifest(path):
              with zipfile.ZipFile(path) as z:
                  return json.loads(z.read("package.json"))
          runtime=root/f"runtime-python-{arch}.zip"
          wheels=root/f"core-wheels-{arch}.zip"
          rm=package_manifest(runtime)
          with zipfile.ZipFile(wheels) as z:
              wm=json.loads(z.read("wheelhouse.json"))
          assert rm["artifact_id"]=="com.sickicarus.monitorbox.runtime.python"
          assert wm["artifact_id"]=="com.sickicarus.monitorbox.core.wheels"
          runtime_ref={
              "artifact_id":rm["artifact_id"],
              "version":rm["version"],
              "build":rm["build"],
              "sha256":hashlib.sha256(runtime.read_bytes()).hexdigest(),
          }
          wheel_ref={
              "artifact_id":"com.sickicarus.monitorbox.core.wheels",
              "version":"1.0.0",
              "build":1,
              "sha256":hashlib.sha256(wheels.read_bytes()).hexdigest(),
          }
          temp=Path(os.environ["RUNNER_TEMP"])
          (temp/"core3-runtime.json").write_text(json.dumps(runtime_ref,sort_keys=True))
          (temp/"core3-wheelhouse.json").write_text(json.dumps(wheel_ref,sort_keys=True))
          PY
      - name: Build exact Core3 and Agent3 packages from pinned MonitorBox source
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=source/tools python source/tools/portable_contracts.py             --artifact-id com.sickicarus.monitorbox.core             --version 3.0.0 --build 1             --output "$RUNNER_TEMP/core-portable.json"
          PYTHONPATH=source/tools python source/tools/portable_contracts.py             --artifact-id com.sickicarus.monitorbox.agent             --version 3.0.0 --build 1             --output "$RUNNER_TEMP/agent-portable.json"
          PYTHONPATH=core/tools python core/tools/build_successor_core3_package.py             --source-root core             --artifact-version 3.0.0 --build 1             --git-sha "$CORE_SOURCE_SHA"             --runtime-ref "$RUNNER_TEMP/core3-runtime.json"             --wheelhouse-ref "$RUNNER_TEMP/core3-wheelhouse.json"             --portable-contract "$RUNNER_TEMP/core-portable.json"             --release-eligible             --output "$RUNNER_TEMP/packages/core3-${{ matrix.arch }}.zip"
          PYTHONPATH=core/tools python core/tools/build_successor_agent3_package.py             --source-root core             --artifact-version 3.0.0 --build 1             --git-sha "$CORE_SOURCE_SHA"             --runtime-ref "$RUNNER_TEMP/core3-runtime.json"             --wheelhouse-ref "$RUNNER_TEMP/core3-wheelhouse.json"             --portable-contract "$RUNNER_TEMP/agent-portable.json"             --release-eligible             --output "$RUNNER_TEMP/packages/agent3-${{ matrix.arch }}.zip"
      - name: Build real static scaffold-manager package from the same Core source
        shell: bash
        run: |
          set -euo pipefail
          (
            cd core/scaffold
            CGO_ENABLED=0 GOOS=linux GOARCH="${{ matrix.arch }}"               go build -trimpath -ldflags="-s -w"               -o "$RUNNER_TEMP/monitorbox-scaffold" .
          )
          python core/tools/build_successor_scaffold_manager_package.py             --binary "$RUNNER_TEMP/monitorbox-scaffold"             --arch "${{ matrix.arch }}"             --version 1.0.0 --build 1             --git-sha "$CORE_SOURCE_SHA"             --release-eligible             --output "$RUNNER_TEMP/packages/scaffold-manager-${{ matrix.arch }}.zip"
          test "$(find "$RUNNER_TEMP/packages" -maxdepth 1 -type f -name '*.zip' | wc -l)" = 6
      - uses: actions/upload-artifact@v4
        with:
          name: successor-feed-native-${{ matrix.arch }}
          path: ${{ runner.temp }}/packages/*.zip
          if-no-files-found: error
          retention-days: 1

  build-apps:
    name: Build exact ten successor application modules
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.MODULES_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build reviewed application package set
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MODULES_SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/apps"
          PYTHONPATH=tools python - <<'PY'
          import os
          from pathlib import Path
          from build_successor_first_party_modules import build_all
          paths=build_all(Path(os.environ["RUNNER_TEMP"])/"apps",release_eligible=True)
          assert len(paths)==10, len(paths)
          PY
          test "$(find "$RUNNER_TEMP/apps" -maxdepth 1 -type f -name '*.zip' | wc -l)" = 10
      - uses: actions/upload-artifact@v4
        with:
          name: successor-feed-apps
          path: ${{ runner.temp }}/apps/*.zip
          if-no-files-found: error
          retention-days: 1

  verify-unsigned:
    name: Verify exact 22-package physical feed closure
    needs: [build-native, build-apps]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.MODULES_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false
      - uses: actions/download-artifact@v5
        with:
          pattern: successor-feed-*
          path: ${{ runner.temp }}/packages
          merge-multiple: true
      - name: Re-derive exact unsigned catalog source from package-owned authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(find "$RUNNER_TEMP/packages" -maxdepth 1 -type f -name '*.zip' | wc -l)" = 22
          python tools/build_successor_acceptance_feed_source.py             --package-root "$RUNNER_TEMP/packages"             --module-authority platform/modules/first-party-successor-v1.json             --core-source-sha "$CORE_SOURCE_SHA"             --output "$RUNNER_TEMP/catalog.source.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=json.loads((Path(os.environ["RUNNER_TEMP"])/"catalog.source.json").read_text())
          assert len(root["artifacts"])==22, len(root["artifacts"])
          PY
      - name: Prove full signer admission with an ephemeral non-product key
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "cryptography>=45,<49" "jsonschema>=4,<5"
          feed="$RUNNER_TEMP/feed"
          mkdir -p "$feed/platform/channels/stable" "$feed/platform/packages"
          cp "$RUNNER_TEMP/packages/"*.zip "$feed/platform/packages/"
          export MONITORBOX_PLATFORM_SIGNING_KEY="$(
            python - <<'PY'
          import base64
          from cryptography.hazmat.primitives.serialization import Encoding,PrivateFormat,NoEncryption
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          key=Ed25519PrivateKey.generate()
          raw=key.private_bytes(Encoding.Raw,PrivateFormat.Raw,NoEncryption())
          print(base64.b64encode(raw).decode())
          PY
          )"
          python tools/build_platform_index.py             --source "$RUNNER_TEMP/catalog.source.json"             --package-root "$feed"             --output "$feed/platform/channels/stable/index.json"             --channel stable --sequence 1 --valid-hours 1
          test -s "$feed/platform/channels/stable/index.json"
      - name: Build and smoke the complete loopback feed image locally
        shell: bash
        run: |
          set -euo pipefail
          feed="$RUNNER_TEMP/feed"
          mkdir -p "$feed/tools"
          cp tools/successor_feed_server.go "$feed/tools/"
          cp platform/acceptance-feed.Dockerfile "$feed/Dockerfile"
          docker build -f "$feed/Dockerfile" -t monitorbox-successor-feed:ci "$feed"
          id="$(docker run -d --rm --network host --read-only             --name monitorbox-successor-feed-ci monitorbox-successor-feed:ci)"
          trap 'docker rm -f "$id" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:18081/healthz >/dev/null; then break; fi
            sleep 0.25
          done
          test "$(curl --fail --silent http://127.0.0.1:18081/healthz)" = "ok"
          curl --fail --silent http://127.0.0.1:18081/platform/channels/stable/index.json > "$RUNNER_TEMP/readback-index.json"
          cmp "$RUNNER_TEMP/readback-index.json" "$feed/platform/channels/stable/index.json"

  publish:
    name: Sign and publish immutable successor acceptance feed
    needs: [build-native, build-apps, verify-unsigned]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'SickIcarus' &&
      github.event.inputs.confirmation == 'publish-immutable-successor-feed' &&
      needs.verify-unsigned.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out trusted main signing policy
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate immutable publication identity
        id: identity
        shell: bash
        env:
          RAW_SEQUENCE: ${{ github.event.inputs.sequence }}
        run: |
          set -euo pipefail
          [[ "$RAW_SEQUENCE" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::sequence must be a positive integer"; exit 1;
          }
          tag="mods-$MODULES_SOURCE_SHA-core-$CORE_SOURCE_SHA-seq-$RAW_SEQUENCE"
          {
            echo "sequence=$RAW_SEQUENCE"
            echo "tag=$tag"
            echo "ref=$FEED_IMAGE:$tag"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v5
        with:
          pattern: successor-feed-*
          path: ${{ runner.temp }}/packages
          merge-multiple: true
      - name: Independently re-derive package authority using trusted main
        shell: bash
        run: |
          set -euo pipefail
          test "$(find "$RUNNER_TEMP/packages" -maxdepth 1 -type f -name '*.zip' | wc -l)" = 22
          python tools/build_successor_acceptance_feed_source.py             --package-root "$RUNNER_TEMP/packages"             --module-authority platform/modules/first-party-successor-v1.json             --core-source-sha "$CORE_SOURCE_SHA"             --output "$RUNNER_TEMP/catalog.source.json"
      - name: Install isolated signing dependencies
        run: python -m pip install --disable-pip-version-check "cryptography>=45,<49" "jsonschema>=4,<5"
      - name: Sign exact stable-ceiling acceptance snapshot with official trust root
        shell: bash
        env:
          MONITORBOX_PLATFORM_SIGNING_KEY: ${{ secrets.MONITORBOX_MODULE_SIGNING_KEY }}
          SEQUENCE: ${{ steps.identity.outputs.sequence }}
        run: |
          set -euo pipefail
          test -n "$MONITORBOX_PLATFORM_SIGNING_KEY"
          python - <<'PY'
          import base64,os
          from pathlib import Path
          from cryptography.hazmat.primitives.serialization import Encoding,PublicFormat
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          private=base64.b64decode(os.environ["MONITORBOX_PLATFORM_SIGNING_KEY"],validate=True)
          assert len(private)==32
          actual=base64.b64encode(
              Ed25519PrivateKey.from_private_bytes(private).public_key().public_bytes(
                  Encoding.Raw,PublicFormat.Raw
              )
          ).decode()
          expected=Path("trust/official-ed25519-1.pub").read_text().strip()
          assert actual==expected, "protected signer does not match compiled official trust root"
          PY
          feed="$RUNNER_TEMP/feed"
          mkdir -p "$feed/platform/channels/stable" "$feed/platform/packages"
          cp "$RUNNER_TEMP/packages/"*.zip "$feed/platform/packages/"
          python tools/build_platform_index.py             --source "$RUNNER_TEMP/catalog.source.json"             --package-root "$feed"             --output "$feed/platform/channels/stable/index.json"             --channel stable             --sequence "$SEQUENCE"             --valid-hours 168
          python tools/verify_platform_index.py             "$feed/platform/channels/stable/index.json"             --packages-root "$feed"             --trust-root trust/official-ed25519-1.pub             --channel stable
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Refuse an existing immutable feed identity
        shell: bash
        env:
          REF: ${{ steps.identity.outputs.ref }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$REF" >/dev/null 2>&1; then
            echo "::error::Immutable successor feed tag already exists: $REF"
            exit 1
          fi
      - name: Publish exact multi-architecture immutable feed image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/feed
          file: ${{ runner.temp }}/feed/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.identity.outputs.ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/SickIcarus-Labs/monitorbox-modules
            org.opencontainers.image.revision=${{ env.MODULES_SOURCE_SHA }}
            com.sickicarus.monitorbox.core-source=${{ env.CORE_SOURCE_SHA }}
            com.sickicarus.monitorbox.artifact-class=successor-physical-acceptance-feed
            com.sickicarus.monitorbox.catalog-sequence=${{ steps.identity.outputs.sequence }}
      - name: Read back registry digest and exact platform set
        id: readback
        shell: bash
        env:
          REF: ${{ steps.identity.outputs.ref }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          inspect="$(docker buildx imagetools inspect "$REF")"
          actual="$(awk '/^Digest:/ {print $2; exit}' <<<"$inspect")"
          test "$actual" = "$EXPECTED_DIGEST"
          [[ "$actual" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$REF" --raw > "$RUNNER_TEMP/feed-index.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          value=json.loads((Path(os.environ["RUNNER_TEMP"])/"feed-index.json").read_text())
          platforms={
              (item.get("platform",{}).get("os"),item.get("platform",{}).get("architecture"))
              for item in value.get("manifests",[])
              if item.get("platform",{}).get("os")!="unknown"
          }
          assert platforms=={("linux","amd64"),("linux","arm64")},platforms
          PY
          echo "digest=$actual" >> "$GITHUB_OUTPUT"
          echo "pinned=$FEED_IMAGE@$actual" >> "$GITHUB_OUTPUT"
      - name: Pull by digest and verify exact signed bytes over loopback
        shell: bash
        env:
          PINNED: ${{ steps.readback.outputs.pinned }}
        run: |
          set -euo pipefail
          docker pull "$PINNED"
          id="$(docker run -d --rm --network host --read-only             --name monitorbox-successor-feed-published "$PINNED")"
          trap 'docker rm -f "$id" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:18081/healthz >/dev/null; then break; fi
            sleep 0.2
          done
          curl --fail --silent http://127.0.0.1:18081/platform/channels/stable/index.json > "$RUNNER_TEMP/published-index.json"
          cmp "$RUNNER_TEMP/published-index.json" "$RUNNER_TEMP/feed/platform/channels/stable/index.json"
          python tools/verify_platform_index.py             "$RUNNER_TEMP/published-index.json"             --packages-root "$RUNNER_TEMP/feed"             --trust-root trust/official-ed25519-1.pub             --channel stable
      - name: Record immutable acceptance feed
        shell: bash
        run: |
          {
            echo "### Successor physical-acceptance feed"
            echo
            echo "- modules source: `$MODULES_SOURCE_SHA`"
            echo "- Core/scaffold source: `$CORE_SOURCE_SHA`"
            echo "- catalog sequence: `${{ steps.identity.outputs.sequence }}`"
            echo "- immutable tag: `${{ steps.identity.outputs.ref }}`"
            echo "- pinned image: `${{ steps.readback.outputs.pinned }}`"
            echo "- signed channel semantics inside isolated feed: `stable`"
            echo "- moving public channel tags changed: none"
          } >> "$GITHUB_STEP_SUMMARY"
