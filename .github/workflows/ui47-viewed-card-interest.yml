name: UI47 selective viewed-card live interest

on:
  push:
    branches: [feature/402-ui47-viewed-card-live]
    paths:
      - "sources/ui/1.11.0-build47/**"
      - "tools/*ui_build47*"
      - ".github/workflows/ui47-viewed-card-interest.yml"
  pull_request:
    paths:
      - "sources/ui/1.11.0-build47/**"
      - "tools/*ui_build47*"
      - ".github/workflows/ui47-viewed-card-interest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Immutable UI46 inheritance and deterministic UI47 package
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python tools/accept_ui_build47_package.py

  browser:
    name: Actual iPad/desktop one-second multi-card viewer lease
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Chromium and browser fixtures
        run: |
          python -m pip install --disable-pip-version-check aiohttp playwright
          python -m playwright install --with-deps chromium
      - run: python tools/accept_ui_build47_interest_browser.py
