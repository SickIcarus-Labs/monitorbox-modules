name: Successor cross-repo GHCR access probe

on:
  pull_request:
    paths:
      - ".github/workflows/successor-core-ghcr-access.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  pull-core-successor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull exact private successor scaffold from Core repository package
        shell: bash
        env:
          TAGGED: ghcr.io/sickicarus-labs/monitorbox-successor-feed:handoff-bootstrap-4c10bec75c300f0088358e21adabff2522d481e7
          PINNED: ghcr.io/sickicarus-labs/monitorbox-successor-feed@sha256:a5bd18049cd1b5a6c977559dae693b4d9af3dd1271e72dec2d667ebfb2711977
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$TAGGED"
          docker pull "$TAGGED"
          docker pull "$PINNED"
          test "$(docker image inspect "$TAGGED" --format '{{ index .Config.Labels "com.sickicarus.monitorbox.artifact-class" }}')" = "successor-feed-handoff-bootstrap"
          test "$(docker image inspect "$TAGGED" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')" = "https://github.com/SickIcarus-Labs/monitorbox-modules"
