name: Phase 2 P1 acceptance

on:
  pull_request:
    paths:
      - sources/configuration-bootstrap/**
      - sources/portainer/**
      - sources/unifi/**
      - sources/ui/**
      - tools/build_first_party_configuration_bootstrap_b3.py
      - tools/build_first_party_portainer_b7.py
      - tools/build_first_party_unifi_b5.py
      - tools/build_first_party_ui_build13.py
      - tools/accept_frozen_core_existing_projection.py
      - tools/accept_portainer_phase2.py
      - tools/accept_portainer_adoption_phase2.py
      - tools/accept_unifi_phase2.py
      - tools/accept_ui_phase2.mjs
      - .github/workflows/phase2-p1-acceptance.yml
  push:
    branches:
      - phase2/p1-discovery-endpoint-truth

permissions:
  contents: read

jobs:
  phase2-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build Configuration/Bootstrap Phase-2 candidate reproducibly
        run: |
          python tools/build_first_party_configuration_bootstrap_b3.py --output-dir /tmp/phase2-bootstrap-first
          python tools/build_first_party_configuration_bootstrap_b3.py --output-dir /tmp/phase2-bootstrap-second
          sha256sum /tmp/phase2-bootstrap-first/com.sickicarus.monitorbox.configuration-bootstrap-1.0.2-build3.zip > /tmp/bootstrap-first.sha
          sha256sum /tmp/phase2-bootstrap-second/com.sickicarus.monitorbox.configuration-bootstrap-1.0.2-build3.zip | sed 's#/tmp/phase2-bootstrap-second#/tmp/phase2-bootstrap-first#' > /tmp/bootstrap-second.sha
          diff -u /tmp/bootstrap-first.sha /tmp/bootstrap-second.sha
      - name: Build Portainer Phase-2 candidate reproducibly
        run: |
          python tools/build_first_party_portainer_b7.py --output-dir /tmp/phase2-portainer-first
          python tools/build_first_party_portainer_b7.py --output-dir /tmp/phase2-portainer-second
          sha256sum /tmp/phase2-portainer-first/com.sickicarus.monitorbox.portainer-1.1.1-build7.zip > /tmp/portainer-first.sha
          sha256sum /tmp/phase2-portainer-second/com.sickicarus.monitorbox.portainer-1.1.1-build7.zip | sed 's#/tmp/phase2-portainer-second#/tmp/phase2-portainer-first#' > /tmp/portainer-second.sha
          diff -u /tmp/portainer-first.sha /tmp/portainer-second.sha
      - name: Verify Portainer Phase-2 contracts
        run: python tools/accept_portainer_phase2.py
      - name: Build UI Phase-2 candidate reproducibly
        run: |
          python tools/build_first_party_ui_build13.py --output-dir /tmp/phase2-ui-first
          python tools/build_first_party_ui_build13.py --output-dir /tmp/phase2-ui-second
          sha256sum /tmp/phase2-ui-first/com.sickicarus.monitorbox.ui-1.1.5-build13.zip > /tmp/ui-first.sha
          sha256sum /tmp/phase2-ui-second/com.sickicarus.monitorbox.ui-1.1.5-build13.zip | sed 's#/tmp/phase2-ui-second#/tmp/phase2-ui-first#' > /tmp/ui-second.sha
          diff -u /tmp/ui-first.sha /tmp/ui-second.sha
      - name: Verify UI Phase-2 contracts
        run: node tools/accept_ui_phase2.mjs
      - name: Build UniFi Phase-2 candidate reproducibly
        run: |
          python tools/build_first_party_unifi_b5.py --output-dir /tmp/phase2-unifi-first
          python tools/build_first_party_unifi_b5.py --output-dir /tmp/phase2-unifi-second
          sha256sum /tmp/phase2-unifi-first/com.sickicarus.monitorbox.unifi-1.0.4-build5.zip > /tmp/unifi-first.sha
          sha256sum /tmp/phase2-unifi-second/com.sickicarus.monitorbox.unifi-1.0.4-build5.zip | sed 's#/tmp/phase2-unifi-second#/tmp/phase2-unifi-first#' > /tmp/unifi-second.sha
          diff -u /tmp/unifi-first.sha /tmp/unifi-second.sha
      - name: Verify UniFi Phase-2 contracts
        run: python tools/accept_unifi_phase2.py

      # #158 and the frozen-Core side of #252 run from the private Core
      # repository's ci/phase2-frozen-core-proof branch. The public modules
      # repository token cannot read the private Core repository/package, so
      # duplicating that cross-repository proof here would create a permanent
      # authorization red rather than an acceptance signal.
