name: Successor signed-feed publication contract

on:
  pull_request:
    paths:
      - "docs/release-intent-history/successor-signed-feed-publish-seq8.yml"
      - ".github/workflows/successor-signed-feed-publish-9.yml"
      - "docs/release-intent-history/successor-signed-feed-publish-seq9.yml"
      - "tools/test_successor_signed_feed_publication_9.py"
      - ".github/workflows/successor-signed-feed-stable-pointer.yml"
      - ".github/workflows/successor-signed-feed-stable-pointer-9.yml"
      - "docs/release-intent-history/successor-signed-feed-stable-pointer-seq9.yml"
      - "tools/test_successor_signed_feed_stable_pointer_9.py"
      - "tools/successor_release_pairing.py"
      - "tools/successor_dev_release.py"
      - "tools/test_successor_dev_release.py"
      - "tools/successor_dev_stage.py"
      - "tools/test_successor_dev_stage.py"
      - "tools/sign_successor_dev_stage.py"
      - "tools/test_sign_successor_dev_stage.py"
      - "tools/build_successor_dev_delta.py"
      - "tools/test_build_successor_dev_delta.py"
      - ".github/workflows/publish-successor-dev-core-manager.yml"
      - "tools/test_publish_successor_dev_workflow.py"
      - "tools/test_successor_active_release_surface.py"
      - "tools/successor_release_manifest.py"
      - "tools/successor_oci_evidence.py"
      - "tools/successor_registry_extract.py"
      - "tools/successor_github_source_evidence.py"
      - "tools/successor_github_readonly.py"
      - "tools/test_successor_github_source_evidence.py"
      - "tools/test_successor_github_readonly.py"
      - "tools/successor_ghcr_readonly.py"
      - "tools/successor_stable_witness.py"
      - "tools/successor_promotion_recovery_model.py"
      - "tools/test_successor_promotion_recovery_model.py"
      - "tools/successor_existing_stable_readonly.py"
      - "tools/test_successor_existing_stable_readonly.py"
      - ".github/workflows/successor-live-stable-readonly.yml"
      - "tools/test_successor_stable_witness.py"
      - "tools/successor_registry_readonly_cli.py"
      - "tools/test_successor_registry_extract.py"
      - "tools/test_successor_ghcr_readonly.py"
      - "tools/test_successor_oci_evidence.py"
      - "tools/test_successor_release_manifest.py"
      - "platform/schema/qualified-release-candidate-v1.schema.json"
      - "tools/test_successor_release_pairing.py"
      - "tools/test_successor_active_release_surface.py"
      - ".github/workflows/successor-signed-feed-publication-contract.yml"
      - "tools/build_platform_index.py"
      - "tools/verify_platform_index.py"
      - "tools/portable_contracts.py"
      - "tools/verify_trusted_successor_signer_snapshot.py"
      - "tools/test_trusted_successor_signer_snapshot.py"
      - "tools/test_successor_signed_feed_publication.py"
      - "tools/test_successor_signed_feed_stable_pointer.py"
      - "platform/schema/index-v1.schema.json"
      - "platform/portable/first-party-contracts-v1.json"
      - "platform/acceptance-feed.Dockerfile"
      - "platform/successor-signing/trusted-source-v1.json"
      - "tools/successor_feed_server.go"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false
      - name: Verify exact trusted signer snapshot
        run: python tools/verify_trusted_successor_signer_snapshot.py
      - name: Compile trusted successor signer tools
        run: |
          python -m py_compile             tools/build_platform_index.py             tools/verify_platform_index.py             tools/portable_contracts.py             tools/verify_trusted_successor_signer_snapshot.py
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest "cryptography>=45,<49" "jsonschema>=4,<5" "PyYAML>=6,<7"
      - name: Run publication-control tests
        run: >-
          python -m pytest -q
          tools/test_trusted_successor_signer_snapshot.py
          tools/test_successor_signed_feed_publication.py
          tools/test_successor_signed_feed_publication_9.py
          tools/test_successor_signed_feed_stable_pointer.py
          tools/test_successor_signed_feed_stable_pointer_9.py
          tools/test_successor_release_pairing.py
          tools/test_successor_dev_release.py
          tools/test_successor_dev_stage.py
          tools/test_sign_successor_dev_stage.py
          tools/test_build_successor_dev_delta.py
          tools/test_publish_successor_dev_workflow.py
          tools/test_successor_promotion_recovery_model.py
          tools/test_successor_release_manifest.py
          tools/test_successor_oci_evidence.py
          tools/test_successor_registry_extract.py
          tools/test_successor_github_source_evidence.py
          tools/test_successor_github_readonly.py
          tools/test_successor_ghcr_readonly.py
          tools/test_successor_stable_witness.py
          tools/test_successor_existing_stable_readonly.py
          tools/test_successor_active_release_surface.py
      - name: Inspect public Dev feed pointers (GET-only, diagnostic)
        id: observe-dev
        continue-on-error: true
        shell: bash
        run: |
          for image in             ghcr.io/sickicarus-labs/monitorbox-successor-signed-feed:dev             ghcr.io/sickicarus-labs/monitorbox-successor-supervisor-feed:dev \
            ghcr.io/sickicarus-labs/monitorbox-successor-supervisor-feed:stable \
            ghcr.io/sickicarus-labs/monitorbox-successor-supervisor-feed:beta; do
            echo "Checking $image (no authentication or registry writes)"
            if raw="$(docker buildx imagetools inspect "$image" 2>&1)"; then
              digest="$(printf '%s\n' "$raw" | awk '/^Digest:/ {print $2;exit}')"
              echo "$image $digest"
              echo "$image $digest" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Public Dev tag was not inspectable: $image"
              echo "$image unavailable (access/tag/auth unconfirmed)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Build loopback feed server
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/feed-server" tools/successor_feed_server.go
