name: UI build36 removal and aggregate acceptance

on:
  pull_request:
    paths:
      - "sources/ui/1.3.2-build36/**"
      - "tools/build_first_party_ui_build36.py"
      - "tools/stage_p1_353_ui_build36.py"
      - "tools/accept_ui_build36_removal_aggregate.py"
      - "tools/accept_ui_build36_aggregate.mjs"
      - "release-intents/ui-1.3.2-build36.json"
      - ".github/workflows/ui-build36-removal-aggregate-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Package and source acceptance
        run: python tools/accept_ui_build36_removal_aggregate.py
      - name: JavaScript syntax
        run: |
          node --check sources/ui/1.3.2-build36/modules-removal.js
          node --check sources/ui/1.3.2-build36/aggregate-evidence.js
          node --check sources/ui/1.3.2-build36/network-children.js
      - name: Provider-blind aggregate fixtures
        run: node tools/accept_ui_build36_aggregate.mjs
