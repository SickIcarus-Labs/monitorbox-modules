name: Temporary materialize standalone UI build11 base

on:
  push:
    branches: [codex/core-prune-standalone-ui-build11]
    paths:
      - .github/workflows/tmp-materialize-ui-build11-base.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reconstruct and verify frozen pre-prune UI payload
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import io
          from pathlib import Path
          import zipfile

          root = Path("sources/ui/1.1.3-build11")
          parts = sorted((root / "transport").glob("part-*.txt"))
          if len(parts) != 45:
              raise SystemExit(f"expected 45 transport parts, found {len(parts)}")

          repair_specs = {
              "part-010.txt": {
                  "sha256": "f7e5df80e904dc13cb1d5e1dfec20bc7fbb745ed6ab160d3f21914c0897b3497",
                  "edits": [(2286, 2286, "in"), (2287, 2290, "")],
              },
              "part-021.txt": {
                  "sha256": "e323c809bfc539f2a7be1ee2eb18b96dbb2a81718cbf1bfa8c63bb9433773eb2",
                  "edits": [(2932, 2932, "l"), (2933, 2934, ""), (2936, 2937, "v")],
              },
              "part-038.txt": {
                  "sha256": "cc67ba7bc838324bbebf4cecb92097a8390b06d9c4c5d907f885903fd9ecfdf8",
                  "edits": [(1852, 1853, "W")],
              },
          }

          cleaned_parts = [(path, "".join(path.read_text(encoding="ascii").split())) for path in parts]
          for index, (path, payload) in enumerate(cleaned_parts):
              spec = repair_specs.get(path.name)
              if spec is None:
                  continue
              digest = hashlib.sha256(payload.encode("ascii")).hexdigest()
              if digest != spec["sha256"]:
                  repaired = payload
                  for start, end, replacement in sorted(spec["edits"], reverse=True):
                      repaired = repaired[:start] + replacement + repaired[end:]
                  digest = hashlib.sha256(repaired.encode("ascii")).hexdigest()
                  if digest != spec["sha256"]:
                      raise SystemExit(f"certified repair failed for {path.name}: {digest}")
                  path.write_text(repaired + "\n", encoding="ascii")
                  cleaned_parts[index] = (path, repaired)
                  print(f"repaired {path.name} to certified historical content")

          bad_lengths = [
              (path.name, len(payload), 2816 if index == 44 else 3000)
              for index, (path, payload) in enumerate(cleaned_parts)
              if len(payload) != (2816 if index == 44 else 3000)
          ]
          if bad_lengths:
              raise SystemExit(f"transport part length mismatch: {bad_lengths}")
          encoded = "".join(payload for _, payload in cleaned_parts)
          if len(encoded) != 134816:
              raise SystemExit(f"expected 134816 encoded chars, got {len(encoded)}")
          archive_bytes = base64.b64decode(encoded, validate=True)
          if len(archive_bytes) != 101111:
              raise SystemExit(f"expected 101111 zip bytes, got {len(archive_bytes)}")

          expected_names = {
              "advanced-dirty-state.js",
              "advanced-v22-polish.js",
              "conceptual-presentation.js",
              "dashboard-widgets.js",
              "dashboard.css",
              "dashboard.html",
              "dashboard.js",
              "followup-beta-polish.js",
              "global-debug.css",
              "global-debug.js",
              "http-v22-polish.js",
              "live-ping.js",
              "live-telemetry.js",
              "modules.css",
              "modules.html",
              "modules.js",
              "onboarding-v22-acceptance.js",
              "operation-progress.js",
              "policy-ui.js",
              "quick-add.js",
              "settings-v22-shell.js",
              "v1-beta-hotfix.css",
              "v1-beta-hotfix.js",
              "v1-beta-polish.css",
              "v1-beta-polish.js",
              "v1-detail-parity.css",
              "v1-detail-parity.js",
              "v1-global-diagnostics.js",
              "v1-parity.css",
              "v1-parity.js",
              "v22-shell.css",
              "v22-shell.js",
              "workspace-finish.js",
              "workspace-state.js",
          }
          with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
              if set(archive.namelist()) != expected_names:
                  raise SystemExit("archive asset set does not match the certified build11 base")
              out = root / "base"
              out.mkdir(parents=True, exist_ok=True)
              for name in sorted(expected_names):
                  payload = archive.read(name)
                  target = out / name
                  if target.exists() and target.read_bytes() != payload:
                      raise SystemExit(f"existing frozen base mismatch for {name}")
                  target.write_bytes(payload)

          print(f"verified frozen UI archive sha256={hashlib.sha256(archive_bytes).hexdigest()}")
          print(f"materialized {len(expected_names)} assets")
          PY
      - name: Verify standalone build11 builder against materialized base
        run: |
          python tools/build_first_party_ui_build11.py --output-dir /tmp/ui-build11-packages
          python - <<'PY'
          from pathlib import Path
          import zipfile

          package = Path('/tmp/ui-build11-packages/com.sickicarus.monitorbox.ui-1.1.3-build11.zip')
          if not package.is_file():
              raise SystemExit('build11 package was not produced')
          forbidden = b'monitorbox.v2.modules.ui'
          with zipfile.ZipFile(package) as archive:
              offenders = [
                  name for name in archive.namelist()
                  if name.endswith('.py') and forbidden in archive.read(name)
              ]
              if offenders:
                  raise SystemExit(f'retired Core UI import remains: {offenders}')
          print(f'verified standalone package: {package} ({package.stat().st_size} bytes)')
          PY
      - name: Commit repaired transport and frozen base assets
        run: |
          if git diff --quiet -- sources/ui/1.1.3-build11 && test -z "$(git status --porcelain --untracked-files=all sources/ui/1.1.3-build11/base)"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/ui/1.1.3-build11/transport/part-010.txt sources/ui/1.1.3-build11/transport/part-021.txt sources/ui/1.1.3-build11/transport/part-038.txt sources/ui/1.1.3-build11/base
          git commit -m "ui: materialize certified standalone build11 base"
          git push
