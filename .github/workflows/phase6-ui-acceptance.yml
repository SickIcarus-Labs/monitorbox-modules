name: Phase 6 UI acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - sources/ui/**
      - release-intents/ui-1.1.13-build22.json
      - release-intents/ui-1.1.13-build23.json
      - tests/fixtures/phase6/core-a6ace917-advanced.html
      - tools/stage_phase6_ui_build22.py
      - tools/stage_phase6_ui_build23.py
      - tools/build_first_party_ui_build22.py
      - tools/build_first_party_ui_build23.py
      - tools/accept_ui_phase6_build21.mjs
      - tools/accept_ui_phase6_build22.mjs
      - tools/accept_ui_phase6_build23.mjs
      - tools/accept_ui_phase6_build23_browser.py
      - .github/workflows/phase6-ui-acceptance.yml
  push:
    branches:
      - phase6/p1-startup-convergence
    paths:
      - sources/ui/**
      - release-intents/ui-1.1.13-build22.json
      - release-intents/ui-1.1.13-build23.json
      - tests/fixtures/phase6/core-a6ace917-advanced.html
      - tools/stage_phase6_ui_build22.py
      - tools/stage_phase6_ui_build23.py
      - tools/build_first_party_ui_build22.py
      - tools/build_first_party_ui_build23.py
      - tools/accept_ui_phase6_build21.mjs
      - tools/accept_ui_phase6_build22.mjs
      - tools/accept_ui_phase6_build23.mjs
      - tools/accept_ui_phase6_build23_browser.py
      - .github/workflows/phase6-ui-acceptance.yml

permissions:
  contents: read

concurrency:
  group: phase6-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify pinned Core Advanced fixture provenance
        run: |
          set -euo pipefail
          fixture='tests/fixtures/phase6/core-a6ace917-advanced.html'
          test -s "$fixture"
          grep -Fq 'a6ace91753f196ffc1ec4966880ca4bf839d0d74' "$fixture"
          grep -Fq '934267f49a9794addffbf721556dbf5c241c1a2e' "$fixture"

      - name: Install browser acceptance dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Build replacement UI candidate reproducibly
        run: |
          set -euo pipefail
          python tools/build_first_party_ui_build23.py --output-dir /tmp/phase6-ui-first
          python tools/build_first_party_ui_build23.py --output-dir /tmp/phase6-ui-second
          target='com.sickicarus.monitorbox.ui-1.1.13-build23.zip'
          sha256sum "/tmp/phase6-ui-first/$target" > /tmp/ui-first.sha
          sha256sum "/tmp/phase6-ui-second/$target" | sed 's#/tmp/phase6-ui-second#/tmp/phase6-ui-first#' > /tmp/ui-second.sha
          diff -u /tmp/ui-first.sha /tmp/ui-second.sha
          test ! -e /tmp/phase6-ui-first/com.sickicarus.monitorbox.ui-1.1.13-build21.zip
          test ! -e /tmp/phase6-ui-first/com.sickicarus.monitorbox.ui-1.1.13-build22.zip

      - name: Verify inherited and replacement Phase-6 UI contracts
        run: |
          node tools/accept_ui_phase3_build20.mjs
          node tools/accept_ui_phase6_build21.mjs
          node tools/accept_ui_phase6_build22.mjs
          node tools/accept_ui_phase6_build23.mjs
          python tools/accept_ui_phase6_build23_browser.py

      - name: Prove Phase-6 UI stays inside module release boundaries
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          base="$PR_BASE_SHA"
          if [[ -z "$base" ]]; then
            git fetch --no-tags origin main:refs/remotes/origin/main
            base=refs/remotes/origin/main
          fi
          git cat-file -e "$base^{commit}"
          boundary="$(git merge-base "$base" HEAD)"
          git diff --name-only "$boundary" HEAD > /tmp/phase6-ui-paths.txt
          if grep -Eq '^(channels/|catalog\.source\.json$|index\.json$)' /tmp/phase6-ui-paths.txt; then
            echo '::error::Phase-6 candidate directly changed signed/channel/catalog authority'
            cat /tmp/phase6-ui-paths.txt
            exit 1
          fi
          if grep -Eq '(^|/)core(/|$)' /tmp/phase6-ui-paths.txt; then
            echo '::error::Phase-6 UI candidate unexpectedly changed Core-owned paths'
            cat /tmp/phase6-ui-paths.txt
            exit 1
          fi
          if grep -Eq '^(tools/release_policy\.py|\.github/workflows/(publish|module-channel-publish|release-policy)\.yml)$' /tmp/phase6-ui-paths.txt; then
            echo '::error::Phase-6 UI candidate unexpectedly changed release-topology authority'
            cat /tmp/phase6-ui-paths.txt
            exit 1
          fi
