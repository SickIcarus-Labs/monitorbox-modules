name: Temporary finalize standalone UI build11

on:
  push:
    branches: [codex/core-prune-standalone-ui-build11]
    paths:
      - .github/workflows/tmp-finalize-ui-build11.yml
      - tools/accept_ui_build11_standalone.py

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Add standalone UI build11 to candidate catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog_path = Path('catalog.source.json')
          source = json.loads(catalog_path.read_text(encoding='utf-8'))
          modules = source.get('modules', [])
          identity = ('com.sickicarus.monitorbox.ui', '1.1.3', 11)
          release = {
              'manifest': {
                  'module_id': 'com.sickicarus.monitorbox.ui',
                  'display_name': 'MonitorBox UI',
                  'version': '1.1.3',
                  'build': 11,
                  'schema': 1,
                  'state_schema': 1,
                  'module_type': 'ui',
                  'entrypoints': {'webui': 'monitorbox_ui_b11:install'},
                  'requires_core': '>=2.3.1 <3.0.0',
                  'requires_runtime_api': '>=1 <2',
                  'dependencies': [],
                  'publisher_id': 'com.sickicarus',
                  'permissions': [],
                  'lifecycle_policy': 'required',
              },
              'package': 'com.sickicarus.monitorbox.ui-1.1.3-build11.zip',
          }
          existing = [
              item for item in modules
              if (
                  item.get('manifest', {}).get('module_id'),
                  item.get('manifest', {}).get('version'),
                  item.get('manifest', {}).get('build'),
              ) == identity
          ]
          if existing:
              if existing != [release]:
                  raise SystemExit(f'UI build11 catalog entry drifted: {existing!r}')
          else:
              previous_index = next(
                  index for index, item in enumerate(modules)
                  if item.get('manifest', {}).get('module_id') == 'com.sickicarus.monitorbox.ui'
                  and item.get('manifest', {}).get('version') == '1.1.2'
                  and item.get('manifest', {}).get('build') == 10
              )
              modules.insert(previous_index + 1, release)
              catalog_path.write_text(
                  json.dumps(source, separators=(',', ':'), ensure_ascii=False) + '\n',
                  encoding='utf-8',
              )
          PY
      - name: Build reproducible standalone UI package
        run: python tools/build_first_party_ui_build11.py
      - name: Install acceptance dependencies
        run: python -m pip install --disable-pip-version-check aiohttp==3.11.16 cryptography==50.0.1
      - name: Prove standalone Core boundary
        run: python tools/accept_ui_build11_standalone.py
      - name: Verify full repository contract through UI build11
        run: python tools/accept_repository_ui_build11.py
      - name: Remove temporary transport
        run: |
          if test -d sources/ui/1.1.3-build11/transport; then
            git rm -r sources/ui/1.1.3-build11/transport
          fi
      - name: Commit finalized build11 package and catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.source.json packages/com.sickicarus.monitorbox.ui-1.1.3-build11.zip
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ui: finalize standalone 1.1.3 build 11"
          git push
