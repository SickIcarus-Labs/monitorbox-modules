name: Temporary finalize standalone UI build11

on:
  push:
    branches: [codex/core-prune-standalone-ui-build11]
    paths:
      - .github/workflows/tmp-finalize-ui-build11.yml
      - tools/accept_ui_build11_standalone.py

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Wire build11 into catalog and first-party acceptance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          workflow = Path('.github/workflows/first-party-acceptance.yml')
          text = workflow.read_text(encoding='utf-8')

          additions = (
              ('      - tools/build_first_party_ui_build10.py\n', '      - tools/build_first_party_ui_build11.py\n', 2),
              ('      - tools/accept_repository_build10.py\n', '      - tools/accept_repository_ui_build11.py\n', 2),
              ('      - tools/accept_ui_build10_physical.mjs\n', '      - tools/accept_ui_build11_standalone.py\n', 2),
          )
          for anchor, addition, expected_count in additions:
              count = text.count(anchor)
              if count != expected_count:
                  raise SystemExit(f'acceptance workflow anchor count changed for {anchor.strip()}: {count}')
              text = text.replace(anchor, anchor + addition)

          build_command = '          python tools/build_first_party_ui_build10.py\n'
          if text.count(build_command) != 2:
              raise SystemExit('expected two build-10 reproducibility commands')
          text = text.replace(build_command, '          python tools/build_first_party_ui_build11.py\n')

          runtime_anchor = (
              '      - name: Verify UI Compose hierarchy preserves canonical child truth\n'
              '        run: node tools/accept_ui_compose_hierarchy.mjs\n'
          )
          if text.count(runtime_anchor) != 1:
              raise SystemExit('UI acceptance insertion anchor changed')
          runtime_step = (
              '      - name: Verify standalone UI build-11 Core boundary\n'
              '        run: python tools/accept_ui_build11_standalone.py\n'
          )
          text = text.replace(runtime_anchor, runtime_step + runtime_anchor)

          final_command = '        run: python tools/accept_repository_backup_restore.py\n'
          if text.count(final_command) != 1:
              raise SystemExit('repository acceptance command anchor changed')
          text = text.replace(
              final_command,
              '        run: python tools/accept_repository_ui_build11.py\n',
          )
          workflow.write_text(text, encoding='utf-8')

          catalog_path = Path('catalog.source.json')
          source = json.loads(catalog_path.read_text(encoding='utf-8'))
          modules = source.get('modules', [])
          identity = ('com.sickicarus.monitorbox.ui', '1.1.3', 11)
          existing = [
              item for item in modules
              if (
                  item.get('manifest', {}).get('module_id'),
                  item.get('manifest', {}).get('version'),
                  item.get('manifest', {}).get('build'),
              ) == identity
          ]
          if existing:
              raise SystemExit('UI 1.1.3 build 11 is already present in catalog.source.json')

          previous_index = next(
              index for index, item in enumerate(modules)
              if item.get('manifest', {}).get('module_id') == 'com.sickicarus.monitorbox.ui'
              and item.get('manifest', {}).get('version') == '1.1.2'
              and item.get('manifest', {}).get('build') == 10
          )
          release = {
              'manifest': {
                  'module_id': 'com.sickicarus.monitorbox.ui',
                  'display_name': 'MonitorBox UI',
                  'version': '1.1.3',
                  'build': 11,
                  'schema': 1,
                  'state_schema': 1,
                  'module_type': 'ui',
                  'entrypoints': {'webui': 'monitorbox_ui_b11:install'},
                  'requires_core': '>=2.3.1 <3.0.0',
                  'requires_runtime_api': '>=1 <2',
                  'dependencies': [],
                  'publisher_id': 'com.sickicarus',
                  'permissions': [],
                  'lifecycle_policy': 'required',
              },
              'package': 'com.sickicarus.monitorbox.ui-1.1.3-build11.zip',
          }
          modules.insert(previous_index + 1, release)
          catalog_path.write_text(
              json.dumps(source, separators=(',', ':'), ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Build reproducible standalone UI package
        run: python tools/build_first_party_ui_build11.py
      - name: Install acceptance dependencies
        run: python -m pip install --disable-pip-version-check aiohttp==3.11.16 cryptography==50.0.1
      - name: Prove standalone Core boundary
        run: python tools/accept_ui_build11_standalone.py
      - name: Verify full repository contract through UI build11
        run: python tools/accept_repository_ui_build11.py
      - name: Remove temporary transport and workflows
        run: |
          git rm -r sources/ui/1.1.3-build11/transport
          git rm .github/workflows/tmp-materialize-ui-build11-base.yml
          git rm .github/workflows/tmp-finalize-ui-build11.yml
      - name: Commit finalized build11 source, package, and repository wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.source.json packages/com.sickicarus.monitorbox.ui-1.1.3-build11.zip .github/workflows/first-party-acceptance.yml .github/workflows/publish.yml tools/build_first_party_ui_build11.py tools/accept_repository_ui_build11.py tools/accept_ui_build11_standalone.py sources/ui/1.1.3-build11/base
          git commit -m "ui: finalize standalone 1.1.3 build 11"
          git push
