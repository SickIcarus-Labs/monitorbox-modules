name: SNMP MIB zipimport hotfix

on:
  pull_request:
    paths:
      - tools/build_first_party_snmp.py
      - tools/build_first_party_snmp_mib_hotfix.py
      - tools/accept_snmp_pruned_core.py
      - tools/accept_snmp_mib_zipimport.py
      - tools/stage_snmp_zipimport_hotfix.py
      - tools/stage_snmp_mib_zipimport_hotfix.py
      - .github/workflows/publish.yml
      - .github/workflows/snmp-zipimport-hotfix.yml
  push:
    branches: [main]
    paths:
      - catalog.source.json
      - tools/build_first_party_snmp.py
      - tools/build_first_party_snmp_mib_hotfix.py
      - tools/accept_snmp_pruned_core.py
      - tools/accept_snmp_mib_zipimport.py
      - tools/stage_snmp_zipimport_hotfix.py
      - tools/stage_snmp_mib_zipimport_hotfix.py
      - .github/workflows/publish.yml
      - .github/workflows/snmp-zipimport-hotfix.yml

permissions:
  contents: read

jobs:
  zipimport-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install generic Core/runtime dependencies
        run: python -m pip install --disable-pip-version-check aiohttp==3.11.16 cryptography==50.0.1
      - name: Stage hotfix catalog exactly as publisher will
        run: |
          python tools/stage_snmp_zipimport_hotfix.py
          python tools/stage_snmp_mib_zipimport_hotfix.py
      - name: Build deterministic SNMP MIB hotfix artifact
        run: |
          python tools/build_first_party_snmp_mib_hotfix.py
          sha256sum packages/com.sickicarus.monitorbox.snmp-1.0.4-build6.zip > /tmp/snmp.first
          python tools/build_first_party_snmp_mib_hotfix.py
          sha256sum packages/com.sickicarus.monitorbox.snmp-1.0.4-build6.zip > /tmp/snmp.second
          diff -u /tmp/snmp.first /tmp/snmp.second
      - name: Reproduce appliance MIB ZIP-loading boundary with no ambient PySNMP
        run: python tools/accept_snmp_mib_zipimport.py
      - name: Preserve build-5 pruned-Core/provider semantics coverage
        run: python tools/accept_snmp_pruned_core.py
